<!doctype html>
<html lang="en" data-theme="__THEME__" data-accent="__ACCENT__" data-density="__DENSITY__" data-paths="__PATHS__">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>upex</title>
<meta name="color-scheme" content="dark light">
<style>
/* light-dark(light, dark): the Theme setting picks the scheme, System follows the OS. */
:root { color-scheme: light dark; }
:root[data-theme="light"] { color-scheme: light; }
:root[data-theme="dark"] { color-scheme: dark; }
:root {
  --bg: light-dark(#f6f6f4, #0e1012);
  --panel: light-dark(#ffffff, #15181b);
  --raise: light-dark(#eeeeeb, #1c2024);
  --line: light-dark(#e0e0dc, #262b31);
  --line-strong: light-dark(#c9c9c4, #353c43);
  --text: light-dark(#1a1c1e, #e4e7ea);
  --muted: light-dark(#5a6168, #9aa3ac);
  --accent-soft: color-mix(in srgb, var(--accent) 12%, transparent);
  --warn: light-dark(#8a6100, #f0c050);
  --warn-soft: light-dark(rgba(176, 125, 0, .1), rgba(240, 192, 80, .1));
  --danger: light-dark(#c0352b, #ff7a72);
  --danger-soft: light-dark(rgba(192, 53, 43, .08), rgba(255, 122, 114, .12));
  --sans: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", sans-serif;
  --mono: "Cascadia Mono", "Cascadia Code", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r: 6px;
  --h: 32px; /* control height */
  --pad: 9px; /* list row padding */
}
/* Accent setting; the .ac-* classes color the swatches in Settings. */
/* Default is green here, plain in the terminal. */
:root, .ac-default, .ac-green { --accent: light-dark(#0c8455, #46d39a); --accent-ink: light-dark(#ffffff, #052016); }
:root[data-accent="blue"], .ac-blue { --accent: light-dark(#1f6fd1, #5aa9ff); --accent-ink: light-dark(#ffffff, #04172b); }
:root[data-accent="purple"], .ac-purple { --accent: light-dark(#7445d6, #b18cff); --accent-ink: light-dark(#ffffff, #1a0b33); }
:root[data-accent="orange"], .ac-orange { --accent: light-dark(#b85a00, #ff9f4a); --accent-ink: light-dark(#ffffff, #2b1300); }
:root[data-density="compact"] { --h: 28px; --pad: 4px; }

* { box-sizing: border-box; }
html { scrollbar-color: var(--line-strong) var(--bg); }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 14px/1.45 var(--sans);
  -webkit-font-smoothing: antialiased;
}
::selection { background: var(--accent-soft); color: var(--text); }
input, select, button { font: inherit; color: inherit; }
input, select { caret-color: var(--accent); accent-color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.i { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.mono { font-family: var(--mono); font-size: 12.5px; }

/* Top bar */
header {
  position: sticky; top: 0; z-index: 2;
  background: color-mix(in srgb, var(--bg) 92%, transparent);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--line);
}
.bar { max-width: 1080px; margin: 0 auto; padding: 12px 24px; display: flex; align-items: center; gap: 16px; }
.brand { font-weight: 700; font-size: 16px; letter-spacing: -.01em; display: flex; align-items: center; gap: 8px; }
.brand::before { content: ""; width: 8px; height: 8px; border-radius: 2px; background: var(--accent); }
nav { display: flex; gap: 2px; }
.tab {
  background: none; border: 0; padding: 6px 10px; border-radius: var(--r);
  color: var(--muted); cursor: pointer; display: flex; gap: 6px; align-items: baseline;
}
.tab:hover { color: var(--text); background: var(--raise); }
.tab[aria-current="page"] { color: var(--text); background: var(--raise); }
.tab .n { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.search { margin-left: auto; position: relative; width: min(320px, 40vw); }
.search .i { position: absolute; left: 9px; top: 50%; transform: translateY(-50%); color: var(--muted); }
.search input { width: 100%; padding-left: 32px; padding-right: 28px; }
.search kbd {
  position: absolute; right: 7px; top: 50%; transform: translateY(-50%);
  font: 11px var(--mono); color: var(--muted); border: 1px solid var(--line-strong); border-radius: 4px; padding: 0 5px;
}

/* Controls */
input[type="text"], input[type="number"], input[type="search"], select {
  background: var(--panel); border: 1px solid var(--line-strong); border-radius: var(--r);
  padding: 6px 9px; min-width: 0; height: var(--h);
}
input::placeholder { color: var(--muted); opacity: .8; }
input:hover, select:hover { border-color: var(--muted); }
input[aria-invalid="true"] { border-color: var(--danger); }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  height: var(--h); padding: 0 12px; border-radius: var(--r); cursor: pointer; white-space: nowrap;
  background: var(--raise); border: 1px solid var(--line-strong);
  transition: background-color .15s ease-out, border-color .15s ease-out, color .15s ease-out;
}
.btn:hover { border-color: var(--muted); }
.btn:disabled { opacity: .5; cursor: default; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { color: var(--danger); }
.btn.danger.solid { background: var(--danger); border-color: var(--danger); color: var(--bg); font-weight: 600; }
.btn.ghost { background: none; border-color: transparent; color: var(--muted); }
.btn.ghost:hover { color: var(--text); background: var(--raise); }
.btn.icon { width: var(--h); padding: 0; }
.btn.icon[aria-pressed="true"] { color: var(--accent); }
.btn.ghost.danger:hover { color: var(--danger); background: var(--danger-soft); }

main { max-width: 1080px; margin: 0 auto; padding: 20px 24px 96px; }
h1 { font-size: 20px; letter-spacing: -.015em; margin: 8px 0 4px; }
.lede { color: var(--muted); margin: 0 0 16px; }
.toolbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
.toolbar .grow { flex: 1; }

/* Tag filter */
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip {
  border: 1px solid var(--line-strong); background: none; border-radius: 99px;
  padding: 2px 10px; font-size: 12.5px; color: var(--muted); cursor: pointer;
}
.chip:hover { color: var(--text); }
.chip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--text); }

/* Notice for broken paths */
.notice {
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  border: 1px solid color-mix(in srgb, var(--warn) 40%, transparent); background: var(--warn-soft);
  border-radius: var(--r); padding: 10px 12px; margin-bottom: 12px;
}
.notice .i { color: var(--warn); }
.notice p { margin: 0; flex: 1; min-width: 200px; }

/* Forms (inline, never modal) */
.form {
  border: 1px solid var(--line-strong); background: var(--panel); border-radius: var(--r);
  padding: 14px; margin-bottom: 12px; display: grid; gap: 10px;
}
.form .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.form .row > input { flex: 1 1 160px; }
.form .row > .wide { flex: 3 1 260px; }
.form .err { color: var(--danger); margin: 0; font-size: 13px; }
.form .set-label { min-width: 104px; color: var(--muted); }
.seg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: var(--r); padding: 2px; gap: 2px; }
.seg label { display: flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 4px; cursor: pointer; color: var(--muted); }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg input:checked + label { background: var(--raise); color: var(--text); }
.seg input:focus-visible + label { outline: 2px solid var(--accent); }

/* Shortcut list */
.list { border: 1px solid var(--line); border-radius: var(--r); background: var(--panel); overflow: hidden; }
.item {
  display: grid; grid-template-columns: 18px minmax(120px, 1.1fr) minmax(0, 2.2fr) 64px auto;
  align-items: center; gap: 14px; padding: var(--pad) 12px; border-top: 1px solid var(--line);
}
.item:first-child, .group:first-child { border-top: 0; }
.group .n { margin-left: 8px; opacity: .7; font-variant-numeric: tabular-nums; }
.group { padding: 6px 12px; font-size: 12px; color: var(--muted); border-top: 1px solid var(--line); background: var(--raise); }
.item:hover { background: color-mix(in srgb, var(--raise) 55%, transparent); }
.item > .kind { display: flex; color: var(--muted); }
.item.broken > .kind { color: var(--warn); }
.name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tags { display: flex; gap: 4px; margin-top: 2px; flex-wrap: wrap; }
.tag { font-size: 12px; color: var(--muted); }
.note { font-size: 12px; color: var(--muted); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.target { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: ltr; }
.target .miss { color: var(--warn); font-family: var(--sans); font-size: 12px; margin-right: 8px; }
/* Paths setting: dim parent folders (default), full, or hidden */
.target .leaf, :root[data-paths="full"] .target { color: var(--text); }
:root[data-paths="hidden"] .item > .target { display: none; }
:root[data-paths="hidden"] .item:not(.editing) { grid-template-columns: 18px minmax(120px, 1fr) 64px auto; }
.swatch { width: 10px; height: 10px; border-radius: 3px; background: var(--accent); }
.set-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.set-head h2 { font-size: 15px; margin: 0; }
.custom-accent {
  display: inline-flex; align-items: center; gap: 6px; height: var(--h); padding: 0 10px 0 4px; cursor: pointer;
  color: var(--muted); border: 1px solid var(--line-strong); border-radius: var(--r); font-family: var(--mono); font-size: 12.5px;
}
.custom-accent:hover { color: var(--text); }
.custom-accent.on { color: var(--text); border-color: var(--accent); background: var(--accent-soft); }
.custom-accent input { width: 22px; height: 22px; padding: 0; border: 0; background: none; cursor: pointer; }
.dot { margin-right: 6px; font-weight: 400; }
/* Color labels (store COLORS); a hex comes inline */
.c-red { color: light-dark(#d13438, #ff6b6b); } .c-orange { color: light-dark(#c75000, #ff9f45); } .c-yellow { color: light-dark(#a67c00, #f5cf3c); }
.c-green { color: light-dark(#1f8a3b, #5dd27a); } .c-blue { color: light-dark(#1f6feb, #6aa7ff); } .c-purple { color: light-dark(#8250df, #c08bff); }
.c-gray { color: var(--muted); }
.when { color: var(--muted); font-size: 12px; text-align: right; font-variant-numeric: tabular-nums; }
.actions { display: flex; gap: 4px; align-items: center; justify-content: flex-end; }
.actions select { height: var(--h); width: 122px; }
.actions input.count { width: 56px; }
.actions input.start { width: 150px; }
[hidden] { display: none !important; }
.item.editing { grid-template-columns: 1fr; background: var(--raise); }
.item.editing .form { margin: 0; border: 0; padding: 4px 0; background: none; }
.confirm { display: flex; gap: 6px; align-items: center; }
.confirm span { color: var(--danger); margin-right: 4px; }

.empty { text-align: center; padding: 48px 24px; color: var(--muted); }
.empty strong { display: block; color: var(--text); font-size: 15px; margin-bottom: 4px; }
.empty .btn { margin-top: 14px; }

/* Workspaces */
.ws { border: 1px solid var(--line); border-radius: var(--r); background: var(--panel); margin-bottom: 12px; }
.ws-head { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--line); }
.ws-head h2 { font-size: 15px; margin: 0; flex: 1; }
.ws-head input { flex: 1; }
.ws-entry { display: grid; grid-template-columns: minmax(100px, 1fr) minmax(100px, 1fr) minmax(0, 2fr) auto; gap: 12px; align-items: center; padding: calc(var(--pad) - 2px) 12px; border-bottom: 1px solid var(--line); }
.ws-entry .muted { color: var(--muted); }
.ws-add { padding: 10px 12px; display: flex; gap: 8px; flex-wrap: wrap; }
.ws-add select, .ws-add input { flex: 1 1 120px; }
.ws-add input.count { flex: 0 0 72px; }
.ws-add input.start { flex: 2 1 200px; }
.ws-add.editing { background: var(--raise); border-bottom: 1px solid var(--line); }
.ws-entry.op { grid-template-columns: minmax(100px, 1fr) minmax(0, 3fr) auto; }
.ws-entry.op .confirm { grid-column: span 2; justify-content: flex-end; flex-wrap: wrap; }

/* Status line */
#status {
  position: fixed; left: 50%; bottom: 20px; transform: translate(-50%, 12px); opacity: 0;
  background: var(--raise); border: 1px solid var(--line-strong); border-radius: var(--r);
  padding: 8px 14px; box-shadow: 0 6px 24px rgba(0, 0, 0, .28); max-width: calc(100vw - 32px);
  transition: opacity .18s cubic-bezier(.16, 1, .3, 1), transform .18s cubic-bezier(.16, 1, .3, 1);
  pointer-events: none;
}
#status.show { opacity: 1; transform: translate(-50%, 0); }
#status.error { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 50%, transparent); }

@media (max-width: 760px) {
  .bar { flex-wrap: wrap; padding: 10px 16px; gap: 10px; }
  .search { width: 100%; order: 3; }
  .search kbd { display: none; }
  main { padding: 16px 16px 96px; }
  .item { grid-template-columns: 18px minmax(0, 1fr) auto; grid-template-areas: "i n w" "i t t" "a a a"; row-gap: 6px; }
  .item > .kind { grid-area: i; align-self: start; margin-top: 3px; }
  .item > .nm { grid-area: n; min-width: 0; }
  .item > .target { grid-area: t; }
  .item > .when { grid-area: w; }
  .item > .actions { grid-area: a; justify-content: flex-start; flex-wrap: wrap; }
  :root[data-paths="hidden"] .item:not(.editing) { grid-template-columns: 18px minmax(0, 1fr) auto; grid-template-areas: "i n w" "a a a"; }
  .ws-entry { grid-template-columns: 1fr 1fr auto; }
  .ws-entry .start { grid-column: 1 / 3; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>

<header>
  <div class="bar">
    <div class="brand">upex</div>
    <nav aria-label="Views">
      <button class="tab" data-view="links">Shortcuts <span class="n" id="n-links"></span></button>
      <button class="tab" data-view="apps">Apps <span class="n" id="n-apps"></span></button>
      <button class="tab" data-view="ws">Workspaces <span class="n" id="n-ws"></span></button>
      <button class="tab" data-view="settings">Settings</button>
    </nav>
    <div class="search">
      <svg class="i" aria-hidden="true"><use href="#i-search"/></svg>
      <label class="sr" for="q">Search shortcuts</label>
      <input id="q" type="search" placeholder="Search names, paths, tags" autocomplete="off" spellcheck="false">
      <kbd>/</kbd>
    </div>
  </div>
</header>

<main id="main" aria-busy="true"><p class="lede">Loading shortcuts…</p></main>
<div id="status" role="status" aria-live="polite"></div>

<script nonce="__NONCE__">
const TOKEN = '__TOKEN__';
const NS = 'http://www.w3.org/2000/svg';
const KINDS = { folder: 'Folder', app: 'App', cmd: 'Command', url: 'URL' };
// Kinds each list tab can add; folders on Shortcuts, the rest on Apps.
const TAB_KINDS = { links: ['folder'], apps: ['app', 'cmd', 'url'] };
const TITLES = { links: 'Shortcuts', apps: 'Apps', ws: 'Workspaces', settings: 'Settings' };
const SETTING_OPTS = {
  startView: { shortcuts: 'Shortcuts', apps: 'Apps', workspaces: 'Workspaces', last: 'Last used' },
  sort: { recent: 'Most used', name: 'A to Z', opened: 'Last opened', added: 'Recently added' },
  views: { all: 'All', 'no-workspaces': 'No Workspaces', 'no-apps': 'No Apps', shortcuts: 'Shortcuts only' },
  searchIn: { all: 'Names, paths, tags', names: 'Names only' },
  staleAfter: { 30: '30 days', 60: '60 days', 90: '90 days', 180: '180 days' },
  terminalLayout: { here: 'This window', windows: 'Separate windows', tabs: 'Tabs', panes: 'Split panes' },
  paneSplit: { auto: 'Auto', vertical: 'Side by side', horizontal: 'Stacked' },
  terminalShell: { cmd: 'cmd', powershell: 'PowerShell', pwsh: 'PowerShell 7', profile: 'WT default profile' },
  theme: { system: 'System', dark: 'Dark', light: 'Light' },
  accent: { default: 'Default', green: 'Green', blue: 'Blue', purple: 'Purple', orange: 'Orange' },
  density: { comfortable: 'Comfortable', compact: 'Compact' },
  paths: { dim: 'Dim folders', full: 'Full', hidden: 'Hidden' },
  rowDetails: { both: 'Both', tags: 'Tags', badges: 'Badges', none: 'None' },
  usage: { ago: 'Last opened', opens: 'Opens', off: 'Off' },
  pinned: { top: 'On top', section: 'Own section' },
  groups: { off: 'Off', tags: 'By tag' },
};
// Row details setting: does `what` ('tags' | 'badges') show?
const shows = what => [undefined, 'both', what].includes(S.settings.rowDetails);
// Appearance settings, mirrored onto <html data-*> for the CSS.
const LOOK = ['theme', 'accent', 'density', 'paths'];
// The archived toggle swaps the tab's list for its archived shortcuts.
const tabLinks = (archived = S.archived) => S.links.filter(l => l.tab === S.view && l.archived === archived);
const COPY_WORD = { folder: 'path', app: 'path', cmd: 'command', url: 'URL' };
// config startView -> page tab
const START_TAB = { shortcuts: 'links', apps: 'apps', workspaces: 'ws' };
// Views setting -> page tabs it hides.
const HIDES = { 'no-workspaces': ['ws'], 'no-apps': ['apps'], shortcuts: ['apps', 'ws'] };
// Sort setting -> field, highest first; A to Z has none.
const SORT_FIELD = { recent: 'score', opened: 'lastUsed', added: 'added' };
const isHex = v => /^#[0-9a-f]{6}$/i.test(v || '');
const COLORS = ['red', 'orange', 'yellow', 'green', 'blue', 'purple', 'gray'];
// Color label before the name: a palette or hex dot, or the emoji itself.
const dot = c => c && h('span', { class: 'dot' + (COLORS.includes(c) ? ' c-' + c : ''), style: isHex(c) ? 'color:' + c : null, 'aria-hidden': 'true' },
  COLORS.includes(c) || isHex(c) ? '●' : c);
// Usage setting: last opened, open count or nothing, like the selector.
const usage = l => (S.settings.usage === 'off' ? '' : S.settings.usage === 'opens' ? `${l.uses} open${l.uses === 1 ? '' : 's'}` : ago(l.lastUsed));

const S = {
  links: [], workspaces: {}, apps: [], openers: [], settings: {}, defaults: {}, startTab: '', wt: null, home: '', sep: '/',
  view: null, q: '', tag: null, archived: false,
  adding: false, addKind: 'folder', addErr: '', add: { name: '', target: '', tags: '', opener: '' },
  editing: null, draft: null, editErr: '',
  confirming: null, confirmWs: null, editWs: null, renamingWs: null, wsNewName: '',
  // Keyed by user names, so no prototype ("constructor" etc.).
  openWith: Object.create(null), openCount: Object.create(null), openStart: Object.create(null),
  wsDraft: Object.create(null), newWs: false, newWsName: '',
  opDraft: { name: '', command: '' }, editOp: null, editOpCmd: '', confirmOp: null,
};

// DOM builder; text always goes in as text nodes, never HTML.
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'class') el.className = v;
    else if (k === 'value') el.value = v;
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat(Infinity)) if (kid != null && kid !== false) el.append(kid);
  return el;
}
function icon(name) {
  const s = document.createElementNS(NS, 'svg');
  s.setAttribute('class', 'i');
  s.setAttribute('aria-hidden', 'true');
  const u = document.createElementNS(NS, 'use');
  u.setAttribute('href', '#i-' + name);
  s.append(u);
  return s;
}
const btn = (label, cls, onclick, ico, extra) =>
  h('button', { type: 'button', class: 'btn ' + (cls || ''), onclick, ...extra }, ico && icon(ico), label);
// Open a panel, then focus its first field (only on open, so re-renders never steal focus).
function openPanel(key, id) {
  S[key] = true;
  render();
  document.getElementById(id)?.focus();
}

const iconBtn = (ico, label, cls, onclick, extra) =>
  h('button', { type: 'button', class: 'btn icon ghost ' + (cls || ''), 'aria-label': label, title: label, onclick, ...extra }, icon(ico));

async function api(method, path, body) {
  const res = await fetch('/api/' + path, {
    method,
    headers: { 'content-type': 'application/json', 'x-upex-token': TOKEN },
    body: body && JSON.stringify(body),
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || `Request failed (${res.status})`);
  return data;
}

let statusTimer;
function say(msg, isError) {
  const el = document.getElementById('status');
  el.textContent = msg;
  el.className = 'show' + (isError ? ' error' : '');
  clearTimeout(statusTimer);
  statusTimer = setTimeout(() => (el.className = isError ? 'error' : ''), isError ? 6000 : 2600);
}

// Last loaded state minus the time-based score, so a no-op refresh can skip the re-render.
let seen = '';
const stamp = s => JSON.stringify(s, (k, v) => (k === 'score' ? undefined : v));
// With `skip`, a quiet refresh: no re-render when nothing changed or skip() is true by the time it lands.
async function load(skip) {
  try {
    const s = await api('GET', 'state');
    if (skip && (stamp(s) === seen || skip())) return;
    seen = stamp(s);
    Object.assign(S, s);
  } catch (e) {
    say(e.message, true);
    if (skip) return;
  }
  if (!S.view) {
    S.view = START_TAB[S.startTab] || 'links';
    if (TAB_KINDS[S.view]) S.addKind = TAB_KINDS[S.view][0];
  }
  render();
}

// Run an action, report it, reload. Returns true on success.
async function act(fn, okMsg) {
  try {
    await fn();
    if (okMsg) say(okMsg);
    await load();
    return true;
  } catch (e) {
    say(e.message, true);
    await load();
    return false;
  }
}

function ago(t) {
  if (!t) return 'never';
  const m = (Date.now() - t) / 60000;
  if (m < 1) return 'now';
  if (m < 60) return Math.floor(m) + 'm ago';
  if (m < 1440) return Math.floor(m / 60) + 'h ago';
  if (m < 43200) return Math.floor(m / 1440) + 'd ago';
  return Math.floor(m / 43200) + 'mo ago';
}

function placeholder(kind) {
  if (kind === 'url') return 'github.com/you/repo';
  if (kind === 'cmd') return 'command line, runs in a terminal, e.g. npm run dev';
  if (kind === 'app') return S.sep === '\\' ? 'C:\\Program Files\\App\\app.exe or a command' : '/usr/bin/app or a command';
  return [S.home, 'projects', 'my-app'].join(S.sep);
}

const appLabel = key => (S.apps.find(a => a.key === key) || {}).label || key;
const isTerm = key => Boolean((S.apps.find(a => a.key === key) || {}).terminal);
// What "Default" opens a folder shortcut in; false = a file's default app.
const dflt = l => l.opener || (!l.file && S.settings.defaultOpener);

// Default opener picker for folder shortcuts ('' = none). Shows the current one even if it's copy or unknown.
const openerSelect = (value, set) => h('select', { 'aria-label': 'Default opener', onchange: e => set(e.target.value) },
  h('option', { value: '' }, 'Default opener'),
  S.apps.filter(a => a.key !== 'copy' || a.key === value).map(a => h('option', { value: a.key, selected: value === a.key }, a.label)),
  !!value && !S.apps.some(a => a.key === value) && h('option', { value, selected: true }, value + ' (unknown)'));

// ---------- Shortcuts view ----------

// Search tokens, like the selector filter (filterChoices in interactive.js): #tag, @opener, is:pinned|missing|stale|app,
// prefix match; a bare #, @ or is: is none, an unknown is:x matches none.
const IS = {
  pinned: l => l.pinned,
  missing: l => l.broken,
  stale: l => Date.now() - (l.lastUsed || l.added) >= Number(S.settings.staleAfter || 60) * 864e5,
  app: l => l.kind === 'app' || l.kind === 'cmd',
};
const SEARCH_TOKEN = /^(#|@|is:)(.*)$/;
function tokenTest(w) {
  const [, kind, v] = w.match(SEARCH_TOKEN);
  if (!v) return () => true;
  if (kind === '#') return l => l.tags.some(t => t.toLowerCase().startsWith(v));
  if (kind === '@') return l => l.opener.toLowerCase().startsWith(v);
  const key = Object.keys(IS).find(k => k.startsWith(v));
  return key ? IS[key] : () => false;
}

function visibleLinks() {
  const words = S.q.trim().toLowerCase().split(/(?=[#@])|(?=is:)|\s+/).filter(Boolean);
  const tests = words.filter(w => SEARCH_TOKEN.test(w)).map(tokenTest);
  const q = words.filter(w => !SEARCH_TOKEN.test(w)).join(' ');
  return tabLinks()
    .filter(l => !S.tag || l.tags.includes(S.tag))
    .filter(l => tests.every(t => t(l)))
    .filter(l => !q || [l.name, ...l.aliases, ...(S.settings.searchIn === 'names' ? [] : [l.target, ...l.tags])].some(s => s.toLowerCase().includes(q)))
    .sort((a, b) => { const f = SORT_FIELD[S.settings.sort]; return b.pinned - a.pinned || Math.sign(pinRank(a) - pinRank(b)) || (f ? b[f] - a[f] : 0) || a.name.localeCompare(b.name); });
}

// Groups setting on a sorted list: [heading, links] with pinned on top, then per tag in list order (A to Z when `byName`),
// a link with two tags under both, untagged last.
function groupLinks(list, byName) {
  const tags = [...new Set(list.flatMap(l => l.tags))];
  if (byName) tags.sort((a, b) => a.localeCompare(b));
  return [['Pinned', list.filter(l => l.pinned)], ...tags.map(t => ['#' + t, list.filter(l => l.tags.includes(t))]),
    ['untagged', list.filter(l => !l.tags.length)]].filter(g => g[1].length);
}

// Pin order from the selector (Alt+Up/Down); unordered pins after.
function pinRank(l) {
  return l.pinOrder ?? Infinity;
}

function addForm() {
  const err = h('p', { class: 'err', role: 'alert' }, S.addErr);
  const d = S.add;
  const field = (key, attrs) => h('input', { type: 'text', value: d[key], spellcheck: 'false', autocomplete: 'off',
    oninput: e => (d[key] = e.target.value), ...attrs });
  const target = field('target', { class: 'wide mono', placeholder: placeholder(S.addKind), 'aria-label': KINDS[S.addKind] + ' target' });

    kinds.map(k => [k, KINDS[k]]).map(([k, label]) => [
      h('input', { type: 'radio', name: 'kind', id: 'k-' + k, checked: S.addKind === k, onchange: () => {
        S.addKind = k;
        target.placeholder = placeholder(k);
        target.setAttribute('aria-label', label + ' target');
      } }),
      h('label', { for: 'k-' + k }, icon(k), label),
    ]));
  const submit = async (e) => {
    e.preventDefault();

      // The draft is shared across tabs; an opener picked for a folder must not ride along on an app.
      await api('POST', 'links', { kind: S.addKind, ...d, opener: S.addKind === 'folder' ? d.opener : undefined });
      say(`Added ${d.name.trim()}`);
      S.adding = false; S.addErr = ''; S.add = { name: '', target: '', tags: '', opener: '' };

    } catch (ex) {
      err.textContent = S.addErr = ex.message;
    }

    seg && h('div', { class: 'row' }, seg),
    h('div', { class: 'row' },
      field('name', { id: 'add-name', placeholder: 'name', 'aria-label': 'Name' }),
      target,
      field('tags', { placeholder: 'tags, comma separated', 'aria-label': 'Tags' }),

    h('div', { class: 'row' },

      btn('Cancel', 'ghost', () => close())),

function editRow(l) {

// Target as [parent folders, leaf], like the selector; a URL stays whole.
function splitLeaf(l) {
  const t = l.target;
  const cut = l.kind === 'url' ? 0 : Math.max(t.lastIndexOf('/'), t.lastIndexOf('\\')) + 1;
  return [t.slice(0, cut), h('span', { class: l.kind === 'url' ? null : 'leaf' }, t.slice(cut))];
}

// `again`: a second copy (Groups by tag), which never turns into the edit form.
function row(l, again) {
  if (S.editing === l.name && !again) return editRow(l);

  let actions;
  const archive = (on) => act(() => api('PUT', 'archive', { name: l.name, archived: on }), `${on ? 'Archived' : 'Restored'} ${l.name}`);
  if (S.confirming === l.name) {
    actions = h('div', { class: 'actions confirm' },
      h('span', null, `Delete ${l.name}?`),
      btn('Delete', 'danger solid', () => { S.confirming = null; act(() => api('DELETE', 'links', { name: l.name }), `Deleted ${l.name}`); }),
      btn('Keep', 'ghost', () => { S.confirming = null; render(); }));
  } else if (l.archived) {
    actions = h('div', { class: 'actions' },
      btn('Restore', '', () => archive(false), 'archive'),
      iconBtn('trash', `Delete ${l.name}`, 'danger', () => { S.confirming = l.name; render(); }));
  } else {
    // Window count and start command only show for a terminal opener.
    const term = isTerm(S.openWith[l.name] || dflt(l));

      hidden: !term, 'aria-label': `Windows for ${l.name}`, oninput: e => (S.openCount[l.name] = e.target.value) });
    const start = h('input', { type: 'text', class: 'start mono', placeholder: 'start command', value: S.openStart[l.name] || '',
      hidden: !term, spellcheck: 'false', 'aria-label': `Start command for ${l.name}`, oninput: e => (S.openStart[l.name] = e.target.value) });
    const openWith = l.kind === 'folder' && h('select', { 'aria-label': `Open ${l.name} with`, onchange: e => {
        S.openWith[l.name] = e.target.value;

      } },
      h('option', { value: '' }, dflt(l) ? 'Default: ' + appLabel(dflt(l)) : 'Default app'),
      S.apps.map(a => h('option', { value: a.key, selected: S.openWith[l.name] === a.key }, a.label)));
    const open = () => act(() => api('POST', 'open', {
      name: l.name, app: S.openWith[l.name] || undefined, ...(!count.hidden && { count: count.value, start: start.value }),
    }), `Opened ${l.name}`);
    const copy = () => Promise.resolve().then(() => navigator.clipboard.writeText(l.target))
      .then(() => say('Copied ' + l.target), () => say('Could not copy to the clipboard.', true));
    actions = h('div', { class: 'actions' },
      openWith, count, start,
      btn('Open', '', open, 'open', { disabled: l.broken, title: l.broken ? 'Path is missing. Edit it first.' : null }),
      iconBtn('pin', l.pinned ? `Unpin ${l.name}` : `Pin ${l.name} to the top`, '',
        () => act(() => api('PUT', 'pin', { name: l.name, pinned: !l.pinned }), `${l.pinned ? 'Unpinned' : 'Pinned'} ${l.name}`),
        { 'aria-pressed': String(l.pinned) }),
      iconBtn('copy', `Copy ${COPY_WORD[l.kind]} of ${l.name}`, '', copy),
      iconBtn('edit', `Edit ${l.name}`, '', () => {
        S.editing = l.name; S.editErr = '';
        S.draft = { name: l.name, target: l.target, tags: l.tags.join(', '), aliases: l.aliases.join(', '), note: l.note, color: l.color };
        render();

      }),
      iconBtn('archive', `Archive ${l.name} (hide it, restore any time)`, '', () => archive(true)),
      iconBtn('trash', `Delete ${l.name}`, 'danger', () => { S.confirming = l.name; render(); }));
  }

  return h('div', { class: 'item' + (l.broken ? ' broken' : '') },
    h('span', { class: 'kind', title: l.broken ? 'Path missing' : KINDS[l.kind] }, icon(l.broken ? 'alert' : l.kind)),
    h('div', { class: 'nm' },
      h('div', { class: 'name', title: l.name }, dot(l.color), l.name),
      ((shows('tags') && l.tags.length > 0) || l.aliases.length > 0) && h('div', { class: 'tags' },
        l.aliases.length > 0 && h('span', { class: 'tag', title: 'Aliases' }, 'aka ' + l.aliases.join(', ')),
        shows('tags') && l.tags.map(t => h('span', { class: 'tag' }, '#' + t))),
      l.note && h('div', { class: 'note', title: l.note }, l.note)),
    h('div', { class: 'target mono', title: l.target }, l.broken && shows('badges') && h('span', { class: 'miss' }, 'missing'), ...splitLeaf(l)),
    h('div', { class: 'when', title: S.settings.usage === 'opens' ? 'Times opened' : 'Last opened' }, usage(l)),
    actions);
}

function linksView() {
  const out = [];
  const shelved = tabLinks(true);
  if (!shelved.length) S.archived = false;
  const mine = tabLinks();
  const isApps = S.view === 'apps';
  const newLabel = isApps ? 'New app' : 'New shortcut';
  const broken = S.links.filter(l => l.broken && !l.archived);
  const tags = [...new Set(mine.flatMap(l => l.tags))].sort();

  out.push(h('div', { class: 'toolbar' },
    tags.length > 0 && h('div', { class: 'chips', role: 'group', 'aria-label': 'Filter by tag' },
      tags.map(t => h('button', { type: 'button', class: 'chip', 'aria-pressed': String(S.tag === t),
        onclick: () => { S.tag = S.tag === t ? null : t; render(); } }, '#' + t))),
    h('div', { class: 'grow' }),
    shelved.length > 0 && h('button', { type: 'button', class: 'chip', 'aria-pressed': String(S.archived),
      onclick: () => { S.archived = !S.archived; S.tag = null; S.adding = false; render(); } }, `Archived ${shelved.length}`),
    h('select', { id: 'sort', 'aria-label': 'Sort', onchange: e =>
        act(() => api('PUT', 'settings', { sort: e.target.value })).then(() => document.getElementById('sort')?.focus()) },
      Object.entries(SETTING_OPTS.sort).map(([k, label]) => h('option', { value: k, selected: S.settings.sort === k }, label))),
    !S.adding && !S.archived && btn(newLabel, 'primary', () => openPanel('adding', 'add-name'), 'plus', { 'aria-keyshortcuts': 'n' })));

  if (broken.length) {
    out.push(h('div', { class: 'notice', role: 'region', 'aria-label': 'Missing paths' },
      icon('alert'),
      h('p', null, `${broken.length} folder${broken.length === 1 ? '' : 's'} no longer exist: `, broken.map(l => l.name).join(', '),
        '. Edit them, or remove them all. Shortcuts that also launch an app keep the app.'),
      btn(`Remove ${broken.length} missing`, 'danger', () =>
        act(async () => {
          const { removed } = await api('POST', 'prune');
          say(`Removed ${removed.length} shortcut${removed.length === 1 ? '' : 's'}`);

  }

  if (S.adding) out.push(addForm());

  const list = visibleLinks();
  if (!mine.length) {
    out.push(h('div', { class: 'list' }, h('div', { class: 'empty' },
      h('strong', null, isApps ? 'No apps yet' : 'No shortcuts yet'),
      isApps
        ? 'An app shortcut launches a program, runs a command line in a terminal, or opens a URL. Run it here or with upex <name> in a terminal.'
        : 'A shortcut is a short name for a folder. Open it here or with upex <name> in a terminal.',
      h('div', null, !S.adding && btn(isApps ? 'Add your first app' : 'Add your first shortcut', 'primary', () => openPanel('adding', 'add-name'), 'plus')))));
  } else if (!list.length) {
    out.push(h('div', { class: 'list' }, h('div', { class: 'empty' },
      h('strong', null, 'Nothing matches'),
      `No shortcut has "${S.q || '#' + S.tag}" in its name, alias, target or tags.`,
      h('div', null, btn('Clear filters', '', () => { S.q = ''; S.tag = null; document.getElementById('q').value = ''; render(); })))));
  } else if (S.settings.groups === 'tags' && !S.q.trim() && !S.tag && list.some(l => l.tags.length)) {
    const seen = new Set();
    out.push(h('div', { class: 'list' }, groupLinks(list, S.settings.sort === 'name').map(([g, ls]) => [
      h('div', { class: 'group', role: 'heading', 'aria-level': '2' }, g, h('span', { class: 'n' }, String(ls.length))),
      ls.map((l) => { const again = seen.has(l.name); seen.add(l.name); return row(l, again); }),
    ])));
  } else {
    // Pinned setting 'section': Pinned / All headings.
    const heads = S.settings.pinned === 'section' && list[0].pinned;

      heads && (i === 0 || l.pinned !== list[i - 1].pinned) && h('div', { class: 'group', role: 'heading', 'aria-level': '2' }, l.pinned ? 'Pinned' : 'All'),
      row(l),
    ])));
  }
  return out;
}

// Entry form: adds an entry, or edits one in place when `editing`.
function entryForm(key, init, onSubmit, editing) {
  const d = S.wsDraft[key] ||= { shortcut: '', app: '', count: '', start: '', ...init };
  const set = k => e => (d[k] = e.target.value);
  const names = S.links.filter(l => !l.archived).map(l => l.name).sort((a, b) => a.localeCompare(b));
  // Keep a missing shortcut selectable so editing doesn't silently drop it.
  if (d.shortcut && !names.includes(d.shortcut)) names.unshift(d.shortcut);
  const cancel = () => { delete S.wsDraft[key]; S.editWs = null; render(); };
  return h('form', { class: 'ws-add' + (editing ? ' editing' : ''), onkeydown: e => editing && e.key === 'Escape' && cancel(), onsubmit: async e => {
      e.preventDefault();
      if (!d.shortcut) return say('Pick a shortcut first', true);

      if (await onSubmit({ ...d })) { delete S.wsDraft[key]; render(); }

    h('select', { id: editing ? 'ws-edit-first' : null, 'aria-label': 'Shortcut', onchange: set('shortcut') },

    h('input', { type: 'number', class: 'count', min: 1, max: 9, placeholder: 'x1', value: d.count, 'aria-label': 'Window count (terminals)', oninput: set('count') }),
    h('input', { type: 'text', class: 'start mono', placeholder: 'start command, e.g. claude (terminals)', value: d.start, spellcheck: 'false', 'aria-label': 'Start command', oninput: set('start') }),
    h('button', { type: 'submit', class: 'btn' + (editing ? ' primary' : '') }, icon(editing ? 'check' : 'plus'), editing ? 'Save' : 'Add entry'),

// prev: the list this page saw (null = new); the server refuses if it changed since.
const saveWs = (name, entries, msg, prev) => act(() => api('PUT', 'workspace', { name, entries, prev }), msg);
function wsHead(name, entries) {
  if (S.confirmWs === name) {
    return h('div', { class: 'ws-head' }, h('h2', null, name),
      h('div', { class: 'confirm' }, h('span', null, `Delete workspace ${name}?`),
        btn('Delete', 'danger solid', () => { S.confirmWs = null; saveWs(name, [], `Deleted ${name}`, entries); }),
        btn('Keep', 'ghost', () => { S.confirmWs = null; render(); })));
  }
  if (S.renamingWs === name) {
    const cancel = () => { S.renamingWs = null; render(); };
    return h('form', { class: 'ws-head', onkeydown: e => e.key === 'Escape' && cancel(), onsubmit: async e => {
        e.preventDefault();
        const to = S.wsNewName.trim();
        if (to === name) return cancel();
        const ok = await act(() => api('PUT', 'workspace', { name, newName: to, entries, prev: entries }), `Renamed ${name} to ${to}`);
        if (ok) { S.renamingWs = null; render(); }
      } },
      h('input', { type: 'text', id: 'ws-rename', value: S.wsNewName, spellcheck: 'false', autocomplete: 'off', 'aria-label': `New name for ${name}`,
        oninput: e => (S.wsNewName = e.target.value) }),
      h('button', { type: 'submit', class: 'btn primary' }, icon('check'), 'Rename'),
      btn('Cancel', 'ghost', cancel));
  }
  return h('div', { class: 'ws-head' }, h('h2', null, name),
    btn('Open all', 'primary', () => act(() => api('POST', 'workspace/open', { name }), `Opened ${name}`), 'open'),
    iconBtn('edit', `Rename workspace ${name}`, '', () => {
      S.renamingWs = name; S.wsNewName = name;
      render();
      document.getElementById('ws-rename')?.select();
    }),
    iconBtn('trash', `Delete workspace ${name}`, 'danger', () => { S.confirmWs = name; render(); }));
}

function wsBlock(name, entries) {
  const known = new Set(S.links.filter(l => !l.archived).flatMap(l => [l.name, ...l.aliases]));
  const shelved = new Set(S.links.filter(l => l.archived).flatMap(l => [l.name, ...l.aliases]));
  const move = async (i, by) => {
    const next = [...entries];
    [next[i], next[i + by]] = [next[i + by], next[i]];
    const label = up => `Move ${entries[i].shortcut} ${up ? 'up' : 'down'}`;
    await saveWs(name, next, label(by < 0).replace('Move', 'Moved'), entries);
    // Keep keyboard focus on the moved entry (the other arrow once it hits an end).
    const btns = [...document.querySelectorAll('section.ws button:enabled')].filter(b => b.closest('section').getAttribute('aria-label') === name);
    const find = up => btns.find(b => b.getAttribute('aria-label') === label(up));
    (find(by < 0) || find(by > 0))?.focus();
  };
  // Includes the entry itself, so a reorder or outside change can't point an open edit at another entry.
  const editKey = i => `${name}\0${i}\0${JSON.stringify(entries[i])}`;
  return h('section', { class: 'ws', 'aria-label': name },
    wsHead(name, entries),
    entries.map((e, i) => S.editWs === editKey(i)
      ? entryForm(editKey(i), { shortcut: e.shortcut, app: e.app || '', count: e.count > 1 ? String(e.count) : '', start: e.start || '' },
          async d => {
            const ok = await saveWs(name, entries.map((x, j) => (j === i ? d : x)), `Saved ${d.shortcut}`, entries);
            if (ok) S.editWs = null;
            return ok;
          }, true)
      : h('div', { class: 'ws-entry' },
        h('span', { class: 'name' }, e.shortcut, !known.has(e.shortcut) && (shelved.has(e.shortcut)
          ? h('span', { class: 'tag', title: 'Restore it to open it here' }, ' (archived)')
          : h('span', { class: 'tag', title: 'No shortcut with this name' }, ' (missing)'))),
        h('span', { class: 'muted' }, (e.app ? appLabel(e.app) : 'Default') + (e.count > 1 ? ` x${e.count}` : '')),
        h('span', { class: 'muted mono start', title: e.start || '' }, e.start || ''),
        h('div', { class: 'actions' },
          iconBtn('up', `Move ${e.shortcut} up`, '', () => move(i, -1), { disabled: i === 0 }),
          iconBtn('down', `Move ${e.shortcut} down`, '', () => move(i, 1), { disabled: i === entries.length - 1 }),
          iconBtn('edit', `Edit ${e.shortcut} in ${name}`, '', () => {
            S.editWs = editKey(i);
            delete S.wsDraft[editKey(i)];
            render();
            document.getElementById('ws-edit-first')?.focus();
          }),
          iconBtn('x', `Remove ${e.shortcut} from ${name}`, 'danger', () =>
            saveWs(name, entries.filter((_, j) => j !== i), entries.length === 1 ? `Deleted ${name}` : `Removed ${e.shortcut}`, entries))))),
    entryForm(name, {}, d => saveWs(name, [...entries, d], `Added ${d.shortcut} to ${name}`, entries)));
}

function wsView() {
  const out = [];
  const names = Object.keys(S.workspaces).filter(n => !S.q || n.toLowerCase().includes(S.q.trim().toLowerCase()));
  out.push(h('div', { class: 'toolbar' }, h('div', { class: 'grow' }),
    !S.newWs && btn('New workspace', 'primary', () => openPanel('newWs', 'ws-name'), 'plus')));

  if (S.newWs) {
    const nameIn = h('input', { type: 'text', id: 'ws-name', placeholder: 'workspace name, e.g. dev', 'aria-label': 'Workspace name', spellcheck: 'false', value: S.newWsName,
      oninput: e => (S.newWsName = e.target.value) });
    out.push(h('div', { class: 'form', onkeydown: e => e.key === 'Escape' && (S.newWs = false, render()) },
      h('div', { class: 'row' }, nameIn, btn('Cancel', 'ghost', () => { S.newWs = false; render(); })),
      h('p', { class: 'lede', style: 'margin:0' }, 'Add the first entry to create it.'),
      entryForm('\0new', {}, async d => {
        const name = S.newWsName.trim();
        if (!name) { say('Give the workspace a name first', true); return false; }
        if (Object.hasOwn(S.workspaces, name)) { say(`"${name}" already exists. Add entries to it below.`, true); return false; }
        const ok = await saveWs(name, [d], `Created ${name}`, null);
        if (ok) { S.newWs = false; S.newWsName = ''; render(); }
        return ok;
      })));
  }

  if (!Object.keys(S.workspaces).length && !S.newWs) {
    out.push(h('div', { class: 'list' }, h('div', { class: 'empty' },
      h('strong', null, 'No workspaces yet'),
      'A workspace opens several shortcuts at once, like a project in VS Code plus two terminals running claude.',
      h('div', null, btn('Create a workspace', 'primary', () => openPanel('newWs', 'ws-name'), 'plus')))));
  }
  for (const n of names) out.push(wsBlock(n, S.workspaces[n]));
  return out;
}

// ---------- Settings view ----------

function settingsView() {
  const s = S.settings;
  // One labelled radio group per setting; saves on change and keeps focus on the picked option.
  // `deco(k)` adds something before an option's label (the accent swatches), `extra` goes after the group.
  const seg = (key, title, msg, deco, extra) => h('div', { class: 'row' },
    h('span', { class: 'set-label', id: 'lbl-' + key }, title),
    h('div', { class: 'seg', role: 'radiogroup', 'aria-labelledby': 'lbl-' + key },
      // Off Windows (wt null) there are no tabs or panes.
      Object.entries(SETTING_OPTS[key]).filter(([k]) => S.wt !== null || key !== 'terminalLayout' || k === 'here' || k === 'windows').map(([k, label]) => [
        h('input', { type: 'radio', name: key, id: `${key}-${k}`, checked: s[key] === k, onchange: () =>
          act(() => api('PUT', 'settings', { [key]: k }), msg(label))
            .then(() => document.getElementById(`${key}-${S.settings[key]}`)?.focus()) }),
        h('label', { for: `${key}-${k}` }, deco?.(k), label),
      ])), extra);
  const notes = [
    s.terminalLayout === 'here' && 'This window: upex in a terminal hands it over, a shell starts at the folder and exit comes back. Opened from here, terminals get their own window.',
    S.wt === false && ['tabs', 'panes'].includes(s.terminalLayout) && 'Windows Terminal (wt) was not found, so terminals open as separate windows.',
    S.wt === false && s.terminalShell === 'profile' && 'Without Windows Terminal, the default profile falls back to cmd.',
    S.wt && s.terminalShell === 'profile' && 'A start command (like claude) runs in cmd, since upex cannot know which shell your default profile uses.',
  ].filter(Boolean);
  // Section heading with a Reset button, off while the section is already at its defaults.
  const head = (id, title, keys) => h('div', { class: 'set-head' },
    h('h2', { id }, title),
    btn('Reset', 'ghost', () => act(() => api('PUT', 'settings/reset', { keys }), `${title} back to defaults`),
      null, { disabled: keys.every(k => s[k] === S.defaults[k]), title: `Reset ${title} settings to their defaults` }));
  const hex = isHex(s.accent) ? s.accent : '';
  // Any color: saved when the picker closes, not on every drag.
  const customAccent = h('label', { class: 'custom-accent' + (hex ? ' on' : ''), title: 'Pick any accent color' },
    h('input', { type: 'color', id: 'accent-custom', value: hex || '#ff66aa', 'aria-label': 'Custom accent color',
      onchange: e => act(() => api('PUT', 'settings', { accent: e.target.value }), `Accent: ${e.target.value}`)
        .then(() => document.getElementById('accent-custom')?.focus()) }),
    hex || 'Custom');
  const pickOpener = e => act(() => api('PUT', 'settings', { defaultOpener: e.target.value }), `Folders open in ${appLabel(e.target.value)}`)
    .then(() => document.getElementById('set-opener')?.focus());
  return [
    h('section', { class: 'form', 'aria-labelledby': 'set-gen' },
      head('set-gen', 'General', ['startView', 'views', 'sort', 'searchIn', 'staleAfter']),
      h('p', { class: 'lede', style: 'margin:0' }, 'Shared with the upex selector in the terminal.'),
      seg('startView', 'Start view', l => `upex opens on ${l}`),
      seg('views', 'Tabs', l => `Tabs: ${l}`),
      seg('sort', 'Sort', l => `Sorted: ${l}`),
      seg('searchIn', 'Search in', l => `Search: ${l.toLowerCase()}`),
      seg('staleAfter', 'Stale after', l => `is:stale: not opened in ${l}`)),
    h('section', { class: 'form', 'aria-labelledby': 'set-term' },
      head('set-term', 'Terminals', ['terminalLayout', 'paneSplit', 'terminalShell']),
      h('p', { class: 'lede', style: 'margin:0' }, S.wt === null ? 'Where terminal openers run: in the terminal upex runs in, or in a new window.'
        : 'The shell terminal openers start, and whether they run in this terminal, in new windows, or as tabs or split panes in your current Windows Terminal window.'),
      seg('terminalLayout', 'Layout', l => `Terminals open in ${l.toLowerCase()}`),
      S.wt !== null && s.terminalLayout === 'panes' && seg('paneSplit', 'Pane split', l => `Panes split: ${l.toLowerCase()}`),
      S.wt !== null && seg('terminalShell', 'Shell', l => `Terminals start ${l}`),
      notes.map(n => h('p', { class: 'tag', style: 'margin:0' }, n))),
    h('section', { class: 'form', 'aria-labelledby': 'set-open' },
      head('set-open', 'Opening', ['defaultOpener']),
      h('p', { class: 'lede', style: 'margin:0' }, 'Folder shortcuts without their own opener open in this app. Files still open in their default app.'),
      h('div', { class: 'row' },
        h('label', { class: 'set-label', for: 'set-opener' }, 'Default opener'),
        h('select', { id: 'set-opener', onchange: pickOpener },
          S.apps.filter(a => a.key !== 'copy').map(a => h('option', { value: a.key, selected: s.defaultOpener === a.key }, a.label)),
          !S.apps.some(a => a.key === s.defaultOpener) && h('option', { value: s.defaultOpener, selected: true }, s.defaultOpener)))),
    h('section', { class: 'form', 'aria-labelledby': 'set-look' },
      head('set-look', 'Appearance', ['theme', 'accent', 'density', 'paths', 'rowDetails', 'usage', 'pinned', 'groups']),
      h('p', { class: 'lede', style: 'margin:0' }, 'All but theme also apply to the upex selector. Theme is this page only, the terminal keeps its own colors.'),
      seg('theme', 'Theme', l => `Theme: ${l}`),
      seg('accent', 'Accent', l => `Accent: ${l}`, k => h('span', { class: 'swatch ac-' + k, 'aria-hidden': 'true' }), customAccent),
      seg('density', 'Density', l => `Density: ${l}`),
      seg('paths', 'Paths', l => `Paths: ${l}`),
      seg('rowDetails', 'Row details', l => `Row details: ${l}`),
      seg('usage', 'Usage', l => `Usage: ${l}`),
      seg('pinned', 'Pinned', l => `Pinned: ${l}`),
      seg('groups', 'Groups', l => `Groups: ${l}`)),
    h('section', { class: 'form', 'aria-labelledby': 'set-apps' },
      h('h2', { id: 'set-apps', style: 'font-size:15px;margin:0' }, 'Custom openers'),
      h('p', { class: 'lede', style: 'margin:0' }, 'More apps to open folders in, like Cursor or Sublime. upex runs the command with the folder path after it. Same list as upex app in the terminal.'),
      h('div', { class: 'list' }, S.openers.map(openerRow), openerAdd())),
  ];
}

// Custom openers (config.json apps): add, change the command, delete. No rename, shortcuts point at the name.
function openerRow(o) {
  const name = h('span', { class: 'name' }, o.name);
  if (S.editOp === o.name) {
    const cancel = () => { S.editOp = null; render(); };
    return h('form', { class: 'ws-add editing', onkeydown: e => e.key === 'Escape' && cancel(), onsubmit: async e => {
        e.preventDefault();
        if (await act(() => api('PUT', 'opener', { name: o.name, command: S.editOpCmd }), `Saved ${o.name}`)) { S.editOp = null; render(); }
      } },
      name,
      h('input', { type: 'text', id: 'op-edit', class: 'start mono', value: S.editOpCmd, spellcheck: 'false', autocomplete: 'off',
        'aria-label': `Command for ${o.name}`, oninput: e => (S.editOpCmd = e.target.value) }),
      h('button', { type: 'submit', class: 'btn primary' }, icon('check'), 'Save'),
      btn('Cancel', 'ghost', cancel));
  }
  if (S.confirmOp === o.name) {
    const key = o.name.toLowerCase();
    const n = S.links.filter(l => l.opener === key).length;
    const users = [n && `${n} shortcut${n > 1 ? 's' : ''}`, S.settings.defaultOpener === key && 'the default opener'].filter(Boolean);
    return h('div', { class: 'ws-entry op' }, name,
      h('div', { class: 'confirm' },
        h('span', null, `Delete ${o.name}?` + (users.length ? ` Used by ${users.join(' and ')}.` : '')),
        btn('Delete', 'danger solid', () => { S.confirmOp = null; act(() => api('DELETE', 'opener', { name: o.name }), `Deleted ${o.name}`); }),
        btn('Keep', 'ghost', () => { S.confirmOp = null; render(); })));
  }
  return h('div', { class: 'ws-entry op' }, name,
    h('span', { class: 'muted mono start', title: o.command }, o.command),
    h('div', { class: 'actions' },
      iconBtn('edit', `Edit ${o.name}`, '', () => {
        S.editOp = o.name; S.editOpCmd = o.command;
        render();
        document.getElementById('op-edit')?.focus();
      }),
      iconBtn('trash', `Delete ${o.name}`, 'danger', () => { S.confirmOp = o.name; render(); })));
}

function openerAdd() {
  const d = S.opDraft;
  const set = k => e => (d[k] = e.target.value);
  return h('form', { class: 'ws-add', onsubmit: async e => {
      e.preventDefault();
      const name = d.name.trim();
      if (await act(() => api('POST', 'opener', d), `Added ${name}. Pick it in any opener menu.`)) {
        S.opDraft = { name: '', command: '' };
        render();
        document.getElementById('op-name')?.focus();
      }
    } },
    h('input', { type: 'text', id: 'op-name', placeholder: 'name, e.g. cursor', value: d.name, spellcheck: 'false', autocomplete: 'off',
      'aria-label': 'Opener name', oninput: set('name') }),
    h('input', { type: 'text', class: 'start mono', value: d.command, spellcheck: 'false', autocomplete: 'off', 'aria-label': 'Command',
      placeholder: S.sep === '\\' ? 'command, e.g. cursor or C:\\Tools\\subl.exe' :'command, e.g. cursor or /usr/bin/subl', oninput: set('command') }),
    h('button', { type: 'submit', class: 'btn' }, icon('plus'), 'Add opener'));
}

// ---------- Shell ----------

// Appearance onto <html>. A hex accent goes on as inline vars, with black or white ink, whichever reads on it.
function applyLook() {
  const root = document.documentElement;
  for (const k of LOOK) if (S.settings[k]) root.dataset[k] = S.settings[k];
  const hex = isHex(root.dataset.accent) && root.dataset.accent;
  if (!hex) { root.style.removeProperty('--accent'); root.style.removeProperty('--accent-ink'); return; }
  const [r, g, b] = [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16));
  root.style.setProperty('--accent', hex);
  root.style.setProperty('--accent-ink', 0.299 * r + 0.587 * g + 0.114 * b > 150 ? '#111111' : '#ffffff');
}

// Per-tab state: an open add form or tag filter belongs to the tab it was opened on.
function resetTab() {
  S.adding = false; S.addErr = ''; S.tag = null; S.editing = null; S.confirming = null; S.archived = false;
  S.editWs = null; S.renamingWs = null; S.confirmWs = null; S.editOp = null; S.confirmOp = null;
  if (TAB_KINDS[S.view]) S.addKind = TAB_KINDS[S.view][0];
}

function render() {
  applyLook();
  // A tab hidden by the views setting (changed from the terminal) falls back to Shortcuts.
  const hide = HIDES[S.settings.views] || [];
  if (hide.includes(S.view)) { S.view = 'links'; resetTab(); }
  document.getElementById('n-links').textContent = S.links.filter(l => l.tab === 'links' && !l.archived).length;
  document.getElementById('n-apps').textContent = S.links.filter(l => l.tab === 'apps' && !l.archived).length;
  document.getElementById('n-ws').textContent = Object.keys(S.workspaces).length;
  document.querySelectorAll('.tab').forEach((t) => {
    t.hidden = hide.includes(t.dataset.view);
    t.dataset.view === S.view ? t.setAttribute('aria-current', 'page') : t.removeAttribute('aria-current');
  });
  document.getElementById('q').placeholder = S.view === 'ws' ? 'Search workspaces' : S.settings.searchIn === 'names' ? 'Search names' : 'Search names, paths, tags';
  document.getElementById('q').title = S.view === 'ws' ? '' : '#tag, @opener, is:pinned, is:missing, is:stale, is:app narrow the list';
  document.querySelector('.search').hidden = S.view === 'settings';

  const main = document.getElementById('main');
  main.removeAttribute('aria-busy');
  main.replaceChildren(
    h('h1', null, TITLES[S.view]),
    ...(S.view === 'ws' ? wsView() : S.view === 'settings' ? settingsView() : linksView()));
}

document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => {
  if (S.view === t.dataset.view) return;
  S.view = t.dataset.view;
  // Remembered for start view 'last'; Settings is not a place to start.
  const last = { links: 'shortcuts', apps: 'apps', ws: 'workspaces' }[S.view];
  if (last) api('PUT', 'last', { view: last }).catch(() => {});
  resetTab();
  render();
}));
// Coming back to the page re-checks paths and picks up CLI changes, unless something is being edited.
// Re-renders only on a real change: replacing the DOM mid-click would swallow the click that focused the window.
const busy = () => Boolean(S.adding || S.editing || S.newWs || S.editWs || S.renamingWs || S.confirming || S.confirmWs || S.editOp || S.confirmOp ||
  document.querySelector('main :is(input, select):focus'));
window.addEventListener('focus', () => { if (!busy()) load(busy); });
document.getElementById('q').addEventListener('input', e => { S.q = e.target.value; render(); });
document.addEventListener('keydown', e => {
  const typing = /^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement?.tagName);
  if (e.key === '/' && !typing && S.view !== 'settings') { e.preventDefault(); document.getElementById('q').focus(); }
  else if (e.key === 'n' && !typing && !e.ctrlKey && !e.metaKey && TAB_KINDS[S.view] && !S.archived) { e.preventDefault(); openPanel('adding', 'add-name'); }
  else if (e.key === 'Escape' && document.activeElement?.id === 'q') { e.target.value = S.q = ''; e.target.blur(); render(); }
});

applyLook();
load();
</script>
