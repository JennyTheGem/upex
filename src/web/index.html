<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>upex</title>
<meta name="color-scheme" content="dark light">
<style>
:root {
  --bg: #0e1012;
  --panel: #15181b;
  --raise: #1c2024;
  --line: #262b31;
  --line-strong: #353c43;
  --text: #e4e7ea;
  --muted: #9aa3ac;
  --accent: #46d39a;
  --accent-ink: #052016;
  --accent-soft: rgba(70, 211, 154, .13);
  --warn: #f0c050;
  --warn-soft: rgba(240, 192, 80, .1);
  --danger: #ff7a72;
  --danger-soft: rgba(255, 122, 114, .12);
  --sans: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", sans-serif;
  --mono: "Cascadia Mono", "Cascadia Code", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r: 6px;
}
@media (prefers-color-scheme: light) {
  :root {
    --bg: #f6f6f4;
    --panel: #ffffff;
    --raise: #eeeeeb;
    --line: #e0e0dc;
    --line-strong: #c9c9c4;
    --text: #1a1c1e;
    --muted: #5a6168;
    --accent: #0c8455;
    --accent-ink: #ffffff;
    --accent-soft: rgba(12, 132, 85, .1);
    --warn: #8a6100;
    --warn-soft: rgba(176, 125, 0, .1);
    --danger: #c0352b;
    --danger-soft: rgba(192, 53, 43, .08);
  }
}

* { box-sizing: border-box; }
html { scrollbar-color: var(--line-strong) var(--bg); }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 14px/1.45 var(--sans);
  -webkit-font-smoothing: antialiased;
}
::selection { background: var(--accent-soft); color: var(--text); }
input, select, button { font: inherit; color: inherit; }
input, select { caret-color: var(--accent); accent-color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.i { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.mono { font-family: var(--mono); font-size: 12.5px; }

/* Top bar */
header {
  position: sticky; top: 0; z-index: 2;
  background: color-mix(in srgb, var(--bg) 92%, transparent);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--line);
}
.bar { max-width: 1080px; margin: 0 auto; padding: 12px 24px; display: flex; align-items: center; gap: 16px; }
.brand { font-weight: 700; font-size: 16px; letter-spacing: -.01em; display: flex; align-items: center; gap: 8px; }
.brand::before { content: ""; width: 8px; height: 8px; border-radius: 2px; background: var(--accent); }
nav { display: flex; gap: 2px; }
.tab {
  background: none; border: 0; padding: 6px 10px; border-radius: var(--r);
  color: var(--muted); cursor: pointer; display: flex; gap: 6px; align-items: baseline;
}
.tab:hover { color: var(--text); background: var(--raise); }
.tab[aria-current="page"] { color: var(--text); background: var(--raise); }
.tab .n { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.search { margin-left: auto; position: relative; width: min(320px, 40vw); }
.search .i { position: absolute; left: 9px; top: 50%; transform: translateY(-50%); color: var(--muted); }
.search input { width: 100%; padding-left: 32px; padding-right: 28px; }
.search kbd {
  position: absolute; right: 7px; top: 50%; transform: translateY(-50%);
  font: 11px var(--mono); color: var(--muted); border: 1px solid var(--line-strong); border-radius: 4px; padding: 0 5px;
}

/* Controls */
input[type="text"], input[type="number"], input[type="search"], select {
  background: var(--panel); border: 1px solid var(--line-strong); border-radius: var(--r);
  padding: 6px 9px; min-width: 0; height: 32px;
}
input::placeholder { color: var(--muted); opacity: .8; }
input:hover, select:hover { border-color: var(--muted); }
input[aria-invalid="true"] { border-color: var(--danger); }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  height: 32px; padding: 0 12px; border-radius: var(--r); cursor: pointer; white-space: nowrap;
  background: var(--raise); border: 1px solid var(--line-strong);
  transition: background-color .15s ease-out, border-color .15s ease-out, color .15s ease-out;
}
.btn:hover { border-color: var(--muted); }
.btn:disabled { opacity: .5; cursor: default; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { color: var(--danger); }
.btn.danger.solid { background: var(--danger); border-color: var(--danger); color: var(--bg); font-weight: 600; }
.btn.ghost { background: none; border-color: transparent; color: var(--muted); }
.btn.ghost:hover { color: var(--text); background: var(--raise); }
.btn.icon { width: 32px; padding: 0; }
.btn.ghost.danger:hover { color: var(--danger); background: var(--danger-soft); }

main { max-width: 1080px; margin: 0 auto; padding: 20px 24px 96px; }
h1 { font-size: 20px; letter-spacing: -.015em; margin: 8px 0 4px; }
.lede { color: var(--muted); margin: 0 0 16px; }
.toolbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
.toolbar .grow { flex: 1; }

/* Tag filter */
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip {
  border: 1px solid var(--line-strong); background: none; border-radius: 99px;
  padding: 2px 10px; font-size: 12.5px; color: var(--muted); cursor: pointer;
}
.chip:hover { color: var(--text); }
.chip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--text); }

/* Notice for broken paths */
.notice {
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  border: 1px solid color-mix(in srgb, var(--warn) 40%, transparent); background: var(--warn-soft);
  border-radius: var(--r); padding: 10px 12px; margin-bottom: 12px;
}
.notice .i { color: var(--warn); }
.notice p { margin: 0; flex: 1; min-width: 200px; }

/* Forms (inline, never modal) */
.form {
  border: 1px solid var(--line-strong); background: var(--panel); border-radius: var(--r);
  padding: 14px; margin-bottom: 12px; display: grid; gap: 10px;
}
.form .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.form .row > input { flex: 1 1 160px; }
.form .row > .wide { flex: 3 1 260px; }
.form .err { color: var(--danger); margin: 0; font-size: 13px; }
.seg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: var(--r); padding: 2px; gap: 2px; }
.seg label { display: flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 4px; cursor: pointer; color: var(--muted); }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg input:checked + label { background: var(--raise); color: var(--text); }
.seg input:focus-visible + label { outline: 2px solid var(--accent); }

/* Shortcut list */
.list { border: 1px solid var(--line); border-radius: var(--r); background: var(--panel); overflow: hidden; }
.item {
  display: grid; grid-template-columns: 18px minmax(120px, 1.1fr) minmax(0, 2.2fr) 64px auto;
  align-items: center; gap: 14px; padding: 9px 12px; border-top: 1px solid var(--line);
}
.item:first-child { border-top: 0; }
.item:hover { background: color-mix(in srgb, var(--raise) 55%, transparent); }
.item > .kind { display: flex; color: var(--muted); }
.item.broken > .kind { color: var(--warn); }
.name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tags { display: flex; gap: 4px; margin-top: 2px; flex-wrap: wrap; }
.tag { font-size: 12px; color: var(--muted); }
.target { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: ltr; }
.target .miss { color: var(--warn); font-family: var(--sans); font-size: 12px; margin-right: 8px; }
.when { color: var(--muted); font-size: 12px; text-align: right; font-variant-numeric: tabular-nums; }
.actions { display: flex; gap: 4px; align-items: center; justify-content: flex-end; }
.actions select { height: 32px; width: 122px; }
.actions input.count { width: 56px; }
.actions input.start { width: 150px; }
[hidden] { display: none !important; }
.item.editing { grid-template-columns: 1fr; background: var(--raise); }
.item.editing .form { margin: 0; border: 0; padding: 4px 0; background: none; }
.confirm { display: flex; gap: 6px; align-items: center; }
.confirm span { color: var(--danger); margin-right: 4px; }

.empty { text-align: center; padding: 48px 24px; color: var(--muted); }
.empty strong { display: block; color: var(--text); font-size: 15px; margin-bottom: 4px; }
.empty .btn { margin-top: 14px; }

/* Workspaces */
.ws { border: 1px solid var(--line); border-radius: var(--r); background: var(--panel); margin-bottom: 12px; }
.ws-head { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--line); }
.ws-head h2 { font-size: 15px; margin: 0; flex: 1; }
.ws-head input { flex: 1; }
.ws-entry { display: grid; grid-template-columns: minmax(100px, 1fr) minmax(100px, 1fr) minmax(0, 2fr) auto; gap: 12px; align-items: center; padding: 7px 12px; border-bottom: 1px solid var(--line); }
.ws-entry .muted { color: var(--muted); }
.ws-add { padding: 10px 12px; display: flex; gap: 8px; flex-wrap: wrap; }
.ws-add select, .ws-add input { flex: 1 1 120px; }
.ws-add input.count { flex: 0 0 72px; }
.ws-add input.start { flex: 2 1 200px; }
.ws-add.editing { background: var(--raise); border-bottom: 1px solid var(--line); }

/* Status line */
#status {
  position: fixed; left: 50%; bottom: 20px; transform: translate(-50%, 12px); opacity: 0;
  background: var(--raise); border: 1px solid var(--line-strong); border-radius: var(--r);
  padding: 8px 14px; box-shadow: 0 6px 24px rgba(0, 0, 0, .28); max-width: calc(100vw - 32px);
  transition: opacity .18s cubic-bezier(.16, 1, .3, 1), transform .18s cubic-bezier(.16, 1, .3, 1);
  pointer-events: none;
}
#status.show { opacity: 1; transform: translate(-50%, 0); }
#status.error { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 50%, transparent); }

@media (max-width: 760px) {
  .bar { flex-wrap: wrap; padding: 10px 16px; gap: 10px; }
  .search { width: 100%; order: 3; }
  .search kbd { display: none; }
  main { padding: 16px 16px 96px; }
  .item { grid-template-columns: 18px minmax(0, 1fr) auto; grid-template-areas: "i n w" "i t t" "a a a"; row-gap: 6px; }
  .item > .kind { grid-area: i; align-self: start; margin-top: 3px; }
  .item > .nm { grid-area: n; min-width: 0; }
  .item > .target { grid-area: t; }
  .item > .when { grid-area: w; }
  .item > .actions { grid-area: a; justify-content: flex-start; flex-wrap: wrap; }
  .ws-entry { grid-template-columns: 1fr 1fr auto; }
  .ws-entry .start { grid-column: 1 / 3; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7.5A1.5 1.5 0 0 1 4.5 6h4.2l2 2.2h8.8A1.5 1.5 0 0 1 21 9.7v8.8a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 18.5z"/></symbol>
  <symbol id="i-app" viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="2"/><path d="M3.5 9h17M7 6.8h.01M9.5 6.8h.01"/></symbol>
  <symbol id="i-cmd" viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="2"/><path d="m7.5 10 3 2.5-3 2.5M12.5 15.5h4"/></symbol>
  <symbol id="i-url" viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.4-4.4"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-edit" viewBox="0 0 24 24"><path d="M4 20h4L19 9a2.8 2.8 0 0 0-4-4L4 16z"/><path d="m13.5 6.5 4 4"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9.5 7V4.5h5V7M6.5 7l1 13h9l1-13"/></symbol>
  <symbol id="i-open" viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9"/><path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 4 2.8 19.5h18.4z"/><path d="M12 10v4.5M12 17.2h.01"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5 10 17.5 19 7"/></symbol>
  <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8.5" y="8.5" width="11" height="11" rx="1.5"/><path d="M15.5 8.5v-3a1 1 0 0 0-1-1h-9a1 1 0 0 0-1 1v9a1 1 0 0 0 1 1h3"/></symbol>
  <symbol id="i-up" viewBox="0 0 24 24"><path d="m6 14 6-6 6 6"/></symbol>
  <symbol id="i-down" viewBox="0 0 24 24"><path d="m6 10 6 6 6-6"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
</svg>

<header>
  <div class="bar">
    <div class="brand">upex</div>
    <nav aria-label="Views">
      <button class="tab" data-view="links" aria-current="page">Shortcuts <span class="n" id="n-links"></span></button>
      <button class="tab" data-view="apps">Apps <span class="n" id="n-apps"></span></button>
      <button class="tab" data-view="ws">Workspaces <span class="n" id="n-ws"></span></button>
      <button class="tab" data-view="settings">Settings</button>
    </nav>
    <div class="search">
      <svg class="i" aria-hidden="true"><use href="#i-search"/></svg>
      <label class="sr" for="q">Search shortcuts</label>
      <input id="q" type="search" placeholder="Search names, paths, tags" autocomplete="off" spellcheck="false">
      <kbd>/</kbd>
    </div>
  </div>
</header>

<main id="main" aria-busy="true"><p class="lede">Loading shortcuts…</p></main>
<div id="status" role="status" aria-live="polite"></div>

<script nonce="__NONCE__">
const TOKEN = '__TOKEN__';
const NS = 'http://www.w3.org/2000/svg';
const KINDS = { folder: 'Folder', app: 'App', cmd: 'Command', url: 'URL' };
// Kinds each list tab can add; folders on Shortcuts, the rest on Apps.
const TAB_KINDS = { links: ['folder'], apps: ['app', 'cmd', 'url'] };
const TITLES = { links: 'Shortcuts', apps: 'Apps', ws: 'Workspaces', settings: 'Settings' };
const LAYOUTS = { windows: 'Separate windows', tabs: 'Tabs', panes: 'Split panes' };
const tabLinks = () => S.links.filter(l => l.tab === S.view);
const COPY_WORD = { folder: 'path', app: 'path', cmd: 'command', url: 'URL' };
function savedSort() {
  try { return localStorage.getItem('upex.sort') === 'name' ? 'name' : 'recent'; } catch { return 'recent'; }
}

const S = {
  links: [], workspaces: {}, apps: [], settings: {}, wt: null, home: '', sep: '/',
  view: 'links', q: '', tag: null, sort: savedSort(),
  adding: false, addKind: 'folder', addErr: '', add: { name: '', target: '', tags: '', opener: '' },
  editing: null, draft: null, editErr: '',
  confirming: null, confirmWs: null, editWs: null, renamingWs: null, wsNewName: '',
  // Keyed by user names, so no prototype ("constructor" etc.).
  openWith: Object.create(null), openCount: Object.create(null), openStart: Object.create(null),
  wsDraft: Object.create(null), newWs: false, newWsName: '',
};

// DOM builder; text always goes in as text nodes, never HTML.
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'class') el.className = v;
    else if (k === 'value') el.value = v;
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat(Infinity)) if (kid != null && kid !== false) el.append(kid);
  return el;
}
function icon(name) {
  const s = document.createElementNS(NS, 'svg');
  s.setAttribute('class', 'i');
  s.setAttribute('aria-hidden', 'true');
  const u = document.createElementNS(NS, 'use');
  u.setAttribute('href', '#i-' + name);
  s.append(u);
  return s;
}
const btn = (label, cls, onclick, ico, extra) =>
  h('button', { type: 'button', class: 'btn ' + (cls || ''), onclick, ...extra }, ico && icon(ico), label);
// Open a panel, then focus its first field (only on open, so re-renders never steal focus).
function openPanel(key, id) {
  S[key] = true;
  render();
  document.getElementById(id)?.focus();
}

const iconBtn = (ico, label, cls, onclick, extra) =>
  h('button', { type: 'button', class: 'btn icon ghost ' + (cls || ''), 'aria-label': label, title: label, onclick, ...extra }, icon(ico));

async function api(method, path, body) {
  const res = await fetch('/api/' + path, {
    method,
    headers: { 'content-type': 'application/json', 'x-upex-token': TOKEN },
    body: body && JSON.stringify(body),
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || `Request failed (${res.status})`);
  return data;
}

let statusTimer;
function say(msg, isError) {
  const el = document.getElementById('status');
  el.textContent = msg;
  el.className = 'show' + (isError ? ' error' : '');
  clearTimeout(statusTimer);
  statusTimer = setTimeout(() => (el.className = isError ? 'error' : ''), isError ? 6000 : 2600);
}

// Last loaded state minus the time-based score, so a no-op refresh can skip the re-render.
let seen = '';
const stamp = s => JSON.stringify(s, (k, v) => (k === 'score' ? undefined : v));
// With `skip`, a quiet refresh: no re-render when nothing changed or skip() is true by the time it lands.
async function load(skip) {
  try {
    const s = await api('GET', 'state');
    if (skip && (stamp(s) === seen || skip())) return;
    seen = stamp(s);
    Object.assign(S, s);
  } catch (e) {
    say(e.message, true);
    if (skip) return;
  }
  render();
}

// Run an action, report it, reload. Returns true on success.
async function act(fn, okMsg) {
  try {
    await fn();
    if (okMsg) say(okMsg);
    await load();
    return true;
  } catch (e) {
    say(e.message, true);
    await load();
    return false;
  }
}

function ago(t) {
  if (!t) return 'never';
  const m = (Date.now() - t) / 60000;
  if (m < 1) return 'now';
  if (m < 60) return Math.floor(m) + 'm ago';
  if (m < 1440) return Math.floor(m / 60) + 'h ago';
  if (m < 43200) return Math.floor(m / 1440) + 'd ago';
  return Math.floor(m / 43200) + 'mo ago';
}

function placeholder(kind) {
  if (kind === 'url') return 'github.com/you/repo';
  if (kind === 'cmd') return 'command line, runs in a terminal, e.g. npm run dev';
  if (kind === 'app') return S.sep === '\\' ? 'C:\\Program Files\\App\\app.exe or a command' : '/usr/bin/app or a command';
  return [S.home, 'projects', 'my-app'].join(S.sep);
}

const appLabel = key => (S.apps.find(a => a.key === key) || {}).label || key;
const isTerm = key => Boolean((S.apps.find(a => a.key === key) || {}).terminal);

// Default opener picker for folder shortcuts ('' = none). Shows the current one even if it's copy or unknown.
const openerSelect = (value, set) => h('select', { 'aria-label': 'Default opener', onchange: e => set(e.target.value) },
  h('option', { value: '' }, 'Default opener'),
  S.apps.filter(a => a.key !== 'copy' || a.key === value).map(a => h('option', { value: a.key, selected: value === a.key }, a.label)),
  !!value && !S.apps.some(a => a.key === value) && h('option', { value, selected: true }, value + ' (unknown)'));

// ---------- Shortcuts view ----------

function visibleLinks() {
  const q = S.q.trim().toLowerCase();
  return tabLinks()
    .filter(l => !S.tag || l.tags.includes(S.tag))
    .filter(l => !q || [l.name, l.target, ...l.tags].some(s => s.toLowerCase().includes(q)))
    .sort((a, b) => (S.sort === 'name' ? 0 : b.score - a.score) || a.name.localeCompare(b.name));
}

function addForm() {
  const err = h('p', { class: 'err', role: 'alert' }, S.addErr);
  const d = S.add;
  const field = (key, attrs) => h('input', { type: 'text', value: d[key], spellcheck: 'false', autocomplete: 'off',
    oninput: e => (d[key] = e.target.value), ...attrs });
  const target = field('target', { class: 'wide mono', placeholder: placeholder(S.addKind), 'aria-label': KINDS[S.addKind] + ' target' });
  const kinds = TAB_KINDS[S.view];
  const seg = kinds.length > 1 && h('div', { class: 'seg', role: 'radiogroup', 'aria-label': 'Kind' },
    kinds.map(k => [k, KINDS[k]]).map(([k, label]) => [
      h('input', { type: 'radio', name: 'kind', id: 'k-' + k, checked: S.addKind === k, onchange: () => {
        S.addKind = k;
        target.placeholder = placeholder(k);
        target.setAttribute('aria-label', label + ' target');
      } }),
      h('label', { for: 'k-' + k }, icon(k), label),
    ]));
  const submit = async (e) => {
    e.preventDefault();
    try {
      // The draft is shared across tabs; an opener picked for a folder must not ride along on an app.
      await api('POST', 'links', { kind: S.addKind, ...d, opener: S.addKind === 'folder' ? d.opener : undefined });
      say(`Added ${d.name.trim()}`);
      S.adding = false; S.addErr = ''; S.add = { name: '', target: '', tags: '', opener: '' };
      await load();
    } catch (ex) {
      err.textContent = S.addErr = ex.message;
    }
  };
  const form = h('form', { class: 'form', onsubmit: submit, onkeydown: e => e.key === 'Escape' && close() },
    seg && h('div', { class: 'row' }, seg),
    h('div', { class: 'row' },
      field('name', { id: 'add-name', placeholder: 'name', 'aria-label': 'Name' }),
      target,
      field('tags', { placeholder: 'tags, comma separated', 'aria-label': 'Tags' }),
      S.addKind === 'folder' && openerSelect(d.opener, v => (d.opener = v))),
    h('div', { class: 'row' },
      h('button', { type: 'submit', class: 'btn primary' }, icon('plus'), S.view === 'apps' ? 'Add app' : 'Add shortcut'),
      btn('Cancel', 'ghost', () => close())),
    err);
  function close() { S.adding = false; S.addErr = ''; render(); }
  return form;
}

function editRow(l) {
  const d = S.draft;
  const err = h('p', { class: 'err', role: 'alert' }, S.editErr);
  const field = (key, attrs) => h('input', { type: 'text', value: d[key], spellcheck: 'false', autocomplete: 'off',
    oninput: e => (d[key] = e.target.value), ...attrs });
  const name = field('name', { id: 'edit-name', 'aria-label': 'Name' });
  const save = async (e) => {
    e.preventDefault();
    try {
      await api('PUT', 'links', { old: l.name, ...d });
      say(d.name.trim() !== l.name ? `Renamed ${l.name} to ${d.name.trim()}` : `Saved ${l.name}`);
      S.editing = null; S.editErr = '';
      await load();
    } catch (ex) {
      err.textContent = S.editErr = ex.message;
    }
  };
  const cancel = () => { S.editing = null; S.editErr = ''; render(); };
  return h('div', { class: 'item editing' },
    h('form', { class: 'form', onsubmit: save, onkeydown: e => e.key === 'Escape' && cancel() },
      h('div', { class: 'row' },
        name,
        field('target', { class: 'wide mono', 'aria-label': KINDS[l.kind] + ' target', placeholder: placeholder(l.kind) }),
        field('tags', { 'aria-label': 'Tags', placeholder: 'tags, comma separated' }),
        // Opener is only sent once changed, so a stale one doesn't block saving other edits.
        l.kind === 'folder' && openerSelect(d.opener ?? l.opener, v => (d.opener = v))),
      h('div', { class: 'row' },
        h('button', { type: 'submit', class: 'btn primary' }, icon('check'), 'Save'),
        btn('Cancel', 'ghost', cancel)),
      err));
}

function row(l) {
  if (S.editing === l.name) return editRow(l);

  let actions;
  if (S.confirming === l.name) {
    actions = h('div', { class: 'actions confirm' },
      h('span', null, `Delete ${l.name}?`),
      btn('Delete', 'danger solid', () => { S.confirming = null; act(() => api('DELETE', 'links', { name: l.name }), `Deleted ${l.name}`); }),
      btn('Keep', 'ghost', () => { S.confirming = null; render(); }));
  } else {
    // Window count and start command only show for a terminal opener.
    const term = isTerm(S.openWith[l.name] || l.opener);
    const count = h('input', { type: 'number', class: 'count', min: 1, max: 9, placeholder: 'x1', value: S.openCount[l.name] || '',
      hidden: !term, 'aria-label': `Windows for ${l.name}`, oninput: e => (S.openCount[l.name] = e.target.value) });
    const start = h('input', { type: 'text', class: 'start mono', placeholder: 'start command', value: S.openStart[l.name] || '',
      hidden: !term, spellcheck: 'false', 'aria-label': `Start command for ${l.name}`, oninput: e => (S.openStart[l.name] = e.target.value) });
    const openWith = l.kind === 'folder' && h('select', { 'aria-label': `Open ${l.name} with`, onchange: e => {
        S.openWith[l.name] = e.target.value;
        count.hidden = start.hidden = !isTerm(e.target.value || l.opener);
      } },
      h('option', { value: '' }, l.opener ? 'Default: ' + appLabel(l.opener) : 'Default'),
      S.apps.map(a => h('option', { value: a.key, selected: S.openWith[l.name] === a.key }, a.label)));
    const open = () => act(() => api('POST', 'open', {
      name: l.name, app: S.openWith[l.name] || undefined, ...(!count.hidden && { count: count.value, start: start.value }),
    }), `Opened ${l.name}`);
    const copy = () => Promise.resolve().then(() => navigator.clipboard.writeText(l.target))
      .then(() => say('Copied ' + l.target), () => say('Could not copy to the clipboard.', true));
    actions = h('div', { class: 'actions' },
      openWith, count, start,
      btn('Open', '', open, 'open', { disabled: l.broken, title: l.broken ? 'Path is missing. Edit it first.' : null }),
      iconBtn('copy', `Copy ${COPY_WORD[l.kind]} of ${l.name}`, '', copy),
      iconBtn('edit', `Edit ${l.name}`, '', () => {
        S.editing = l.name; S.editErr = '';
        S.draft = { name: l.name, target: l.target, tags: l.tags.join(', ') };
        render();
        document.getElementById('edit-name')?.focus();
      }),
      iconBtn('trash', `Delete ${l.name}`, 'danger', () => { S.confirming = l.name; render(); }));
  }

  return h('div', { class: 'item' + (l.broken ? ' broken' : '') },
    h('span', { class: 'kind', title: l.broken ? 'Path missing' : KINDS[l.kind] }, icon(l.broken ? 'alert' : l.kind)),
    h('div', { class: 'nm' },
      h('div', { class: 'name', title: l.name }, l.name),
      l.tags.length > 0 && h('div', { class: 'tags' }, l.tags.map(t => h('span', { class: 'tag' }, '#' + t)))),
    h('div', { class: 'target mono', title: l.target }, l.broken && h('span', { class: 'miss' }, 'missing'), l.target),
    h('div', { class: 'when', title: 'Last opened' }, ago(l.lastUsed)),
    actions);
}

function linksView() {
  const out = [];
  const mine = tabLinks();
  const isApps = S.view === 'apps';
  const newLabel = isApps ? 'New app' : 'New shortcut';
  const broken = S.links.filter(l => l.broken);
  const tags = [...new Set(mine.flatMap(l => l.tags))].sort();

  out.push(h('div', { class: 'toolbar' },
    tags.length > 0 && h('div', { class: 'chips', role: 'group', 'aria-label': 'Filter by tag' },
      tags.map(t => h('button', { type: 'button', class: 'chip', 'aria-pressed': String(S.tag === t),
        onclick: () => { S.tag = S.tag === t ? null : t; render(); } }, '#' + t))),
    h('div', { class: 'grow' }),
    h('select', { id: 'sort', 'aria-label': 'Sort', onchange: e => {
        S.sort = e.target.value;
        try { localStorage.setItem('upex.sort', S.sort); } catch {}
        render();
        document.getElementById('sort').focus();
      } },
      h('option', { value: 'recent', selected: S.sort === 'recent' }, 'Most used'),
      h('option', { value: 'name', selected: S.sort === 'name' }, 'A to Z')),
    !S.adding && btn(newLabel, 'primary', () => openPanel('adding', 'add-name'), 'plus', { 'aria-keyshortcuts': 'n' })));

  if (broken.length) {
    out.push(h('div', { class: 'notice', role: 'region', 'aria-label': 'Missing paths' },
      icon('alert'),
      h('p', null, `${broken.length} folder${broken.length === 1 ? '' : 's'} no longer exist: `, broken.map(l => l.name).join(', '),
        '. Edit them, or remove them all. Shortcuts that also launch an app keep the app.'),
      btn(`Remove ${broken.length} missing`, 'danger', () =>
        act(async () => {
          const { removed } = await api('POST', 'prune');
          say(`Removed ${removed.length} shortcut${removed.length === 1 ? '' : 's'}`);
        }))));
  }

  if (S.adding) out.push(addForm());

  const list = visibleLinks();
  if (!mine.length) {
    out.push(h('div', { class: 'list' }, h('div', { class: 'empty' },
      h('strong', null, isApps ? 'No apps yet' : 'No shortcuts yet'),
      isApps
        ? 'An app shortcut launches a program, runs a command line in a terminal, or opens a URL. Run it here or with upex <name> in a terminal.'
        : 'A shortcut is a short name for a folder. Open it here or with upex <name> in a terminal.',
      h('div', null, !S.adding && btn(isApps ? 'Add your first app' : 'Add your first shortcut', 'primary', () => openPanel('adding', 'add-name'), 'plus')))));
  } else if (!list.length) {
    out.push(h('div', { class: 'list' }, h('div', { class: 'empty' },
      h('strong', null, 'Nothing matches'),
      `No shortcut has "${S.q || '#' + S.tag}" in its name, target or tags.`,
      h('div', null, btn('Clear filters', '', () => { S.q = ''; S.tag = null; document.getElementById('q').value = ''; render(); })))));
  } else {
    out.push(h('div', { class: 'list' }, list.map(row)));
  }
  return out;
}

// ---------- Workspaces view ----------

// Entry form: adds an entry, or edits one in place when `editing`.
function entryForm(key, init, onSubmit, editing) {
  const d = S.wsDraft[key] ||= { shortcut: '', app: '', count: '', start: '', ...init };
  const set = k => e => (d[k] = e.target.value);
  const names = S.links.map(l => l.name).sort((a, b) => a.localeCompare(b));
  // Keep a missing shortcut selectable so editing doesn't silently drop it.
  if (d.shortcut && !names.includes(d.shortcut)) names.unshift(d.shortcut);
  const cancel = () => { delete S.wsDraft[key]; S.editWs = null; render(); };
  return h('form', { class: 'ws-add' + (editing ? ' editing' : ''), onkeydown: e => editing && e.key === 'Escape' && cancel(), onsubmit: async e => {
      e.preventDefault();
      if (!d.shortcut) return say('Pick a shortcut first', true);
      // onSubmit already re-rendered with this draft; clear it and render again.
      if (await onSubmit({ ...d })) { delete S.wsDraft[key]; render(); }
    } },
    h('select', { id: editing ? 'ws-edit-first' : null, 'aria-label': 'Shortcut', onchange: set('shortcut') },
      h('option', { value: '' }, 'Shortcut…'),
      names.map(n => h('option', { value: n, selected: d.shortcut === n }, n))),
    h('select', { 'aria-label': 'Open with', onchange: set('app') },
      h('option', { value: '' }, 'Default opener'),
      S.apps.map(a => h('option', { value: a.key, selected: d.app === a.key }, a.label))),
    h('input', { type: 'number', class: 'count', min: 1, max: 9, placeholder: 'x1', value: d.count, 'aria-label': 'Window count (terminals)', oninput: set('count') }),
    h('input', { type: 'text', class: 'start mono', placeholder: 'start command, e.g. claude (terminals)', value: d.start, spellcheck: 'false', 'aria-label': 'Start command', oninput: set('start') }),
    h('button', { type: 'submit', class: 'btn' + (editing ? ' primary' : '') }, icon(editing ? 'check' : 'plus'), editing ? 'Save' : 'Add entry'),
    editing && btn('Cancel', 'ghost', cancel));
}

// prev: the list this page saw (null = new); the server refuses if it changed since.
const saveWs = (name, entries, msg, prev) => act(() => api('PUT', 'workspace', { name, entries, prev }), msg);
function wsHead(name, entries) {
  if (S.confirmWs === name) {
    return h('div', { class: 'ws-head' }, h('h2', null, name),
      h('div', { class: 'confirm' }, h('span', null, `Delete workspace ${name}?`),
        btn('Delete', 'danger solid', () => { S.confirmWs = null; saveWs(name, [], `Deleted ${name}`, entries); }),
        btn('Keep', 'ghost', () => { S.confirmWs = null; render(); })));
  }
  if (S.renamingWs === name) {
    const cancel = () => { S.renamingWs = null; render(); };
    return h('form', { class: 'ws-head', onkeydown: e => e.key === 'Escape' && cancel(), onsubmit: async e => {
        e.preventDefault();
        const to = S.wsNewName.trim();
        if (to === name) return cancel();
        const ok = await act(() => api('PUT', 'workspace', { name, newName: to, entries, prev: entries }), `Renamed ${name} to ${to}`);
        if (ok) { S.renamingWs = null; render(); }
      } },
      h('input', { type: 'text', id: 'ws-rename', value: S.wsNewName, spellcheck: 'false', autocomplete: 'off', 'aria-label': `New name for ${name}`,
        oninput: e => (S.wsNewName = e.target.value) }),
      h('button', { type: 'submit', class: 'btn primary' }, icon('check'), 'Rename'),
      btn('Cancel', 'ghost', cancel));
  }
  return h('div', { class: 'ws-head' }, h('h2', null, name),
    btn('Open all', 'primary', () => act(() => api('POST', 'workspace/open', { name }), `Opened ${name}`), 'open'),
    iconBtn('edit', `Rename workspace ${name}`, '', () => {
      S.renamingWs = name; S.wsNewName = name;
      render();
      document.getElementById('ws-rename')?.select();
    }),
    iconBtn('trash', `Delete workspace ${name}`, 'danger', () => { S.confirmWs = name; render(); }));
}

function wsBlock(name, entries) {
  const known = new Set(S.links.map(l => l.name));
  const move = async (i, by) => {
    const next = [...entries];
    [next[i], next[i + by]] = [next[i + by], next[i]];
    const label = up => `Move ${entries[i].shortcut} ${up ? 'up' : 'down'}`;
    await saveWs(name, next, label(by < 0).replace('Move', 'Moved'), entries);
    // Keep keyboard focus on the moved entry (the other arrow once it hits an end).
    const btns = [...document.querySelectorAll('section.ws button:enabled')].filter(b => b.closest('section').getAttribute('aria-label') === name);
    const find = up => btns.find(b => b.getAttribute('aria-label') === label(up));
    (find(by < 0) || find(by > 0))?.focus();
  };
  // Includes the entry itself, so a reorder or outside change can't point an open edit at another entry.
  const editKey = i => `${name}\0${i}\0${JSON.stringify(entries[i])}`;
  return h('section', { class: 'ws', 'aria-label': name },
    wsHead(name, entries),
    entries.map((e, i) => S.editWs === editKey(i)
      ? entryForm(editKey(i), { shortcut: e.shortcut, app: e.app || '', count: e.count > 1 ? String(e.count) : '', start: e.start || '' },
          async d => {
            const ok = await saveWs(name, entries.map((x, j) => (j === i ? d : x)), `Saved ${d.shortcut}`, entries);
            if (ok) S.editWs = null;
            return ok;
          }, true)
      : h('div', { class: 'ws-entry' },
        h('span', { class: 'name' }, e.shortcut, !known.has(e.shortcut) && h('span', { class: 'tag', title: 'No shortcut with this name' }, ' (missing)')),
        h('span', { class: 'muted' }, (e.app ? appLabel(e.app) : 'Default') + (e.count > 1 ? ` x${e.count}` : '')),
        h('span', { class: 'muted mono start', title: e.start || '' }, e.start || ''),
        h('div', { class: 'actions' },
          iconBtn('up', `Move ${e.shortcut} up`, '', () => move(i, -1), { disabled: i === 0 }),
          iconBtn('down', `Move ${e.shortcut} down`, '', () => move(i, 1), { disabled: i === entries.length - 1 }),
          iconBtn('edit', `Edit ${e.shortcut} in ${name}`, '', () => {
            S.editWs = editKey(i);
            delete S.wsDraft[editKey(i)];
            render();
            document.getElementById('ws-edit-first')?.focus();
          }),
          iconBtn('x', `Remove ${e.shortcut} from ${name}`, 'danger', () =>
            saveWs(name, entries.filter((_, j) => j !== i), entries.length === 1 ? `Deleted ${name}` : `Removed ${e.shortcut}`, entries))))),
    entryForm(name, {}, d => saveWs(name, [...entries, d], `Added ${d.shortcut} to ${name}`, entries)));
}

function wsView() {
  const out = [];
  const names = Object.keys(S.workspaces).filter(n => !S.q || n.toLowerCase().includes(S.q.trim().toLowerCase()));
  out.push(h('div', { class: 'toolbar' }, h('div', { class: 'grow' }),
    !S.newWs && btn('New workspace', 'primary', () => openPanel('newWs', 'ws-name'), 'plus')));

  if (S.newWs) {
    const nameIn = h('input', { type: 'text', id: 'ws-name', placeholder: 'workspace name, e.g. dev', 'aria-label': 'Workspace name', spellcheck: 'false', value: S.newWsName,
      oninput: e => (S.newWsName = e.target.value) });
    out.push(h('div', { class: 'form', onkeydown: e => e.key === 'Escape' && (S.newWs = false, render()) },
      h('div', { class: 'row' }, nameIn, btn('Cancel', 'ghost', () => { S.newWs = false; render(); })),
      h('p', { class: 'lede', style: 'margin:0' }, 'Add the first entry to create it.'),
      entryForm('\0new', {}, async d => {
        const name = S.newWsName.trim();
        if (!name) { say('Give the workspace a name first', true); return false; }
        if (Object.hasOwn(S.workspaces, name)) { say(`"${name}" already exists. Add entries to it below.`, true); return false; }
        const ok = await saveWs(name, [d], `Created ${name}`, null);
        if (ok) { S.newWs = false; S.newWsName = ''; render(); }
        return ok;
      })));
  }

  if (!Object.keys(S.workspaces).length && !S.newWs) {
    out.push(h('div', { class: 'list' }, h('div', { class: 'empty' },
      h('strong', null, 'No workspaces yet'),
      'A workspace opens several shortcuts at once, like a project in VS Code plus two terminals running claude.',
      h('div', null, btn('Create a workspace', 'primary', () => openPanel('newWs', 'ws-name'), 'plus')))));
  }
  for (const n of names) out.push(wsBlock(n, S.workspaces[n]));
  return out;
}

// ---------- Settings view ----------

function settingsView() {
  const cur = S.settings.terminalLayout || 'windows';
  const note = S.wt === null ? 'Windows only. Other systems always open separate windows.'
    : !S.wt && cur !== 'windows' ? 'Windows Terminal (wt) was not found, so terminals open as separate windows.'
    : '';
  return [h('section', { class: 'form', 'aria-labelledby': 'set-term' },
    h('h2', { id: 'set-term', style: 'font-size:15px;margin:0' }, 'Terminals'),
    h('p', { class: 'lede', style: 'margin:0' }, 'When a terminal opener opens more than one window, add them to your current Windows Terminal window as tabs or split panes.'),
    h('div', { class: 'row' }, h('div', { class: 'seg', role: 'radiogroup', 'aria-label': 'Terminal layout' },
      Object.entries(LAYOUTS).map(([k, label]) => [
        h('input', { type: 'radio', name: 'layout', id: 'l-' + k, checked: cur === k, onchange: () =>
          act(() => api('PUT', 'settings', { terminalLayout: k }), `Terminals open as ${label.toLowerCase()}`)
            .then(() => document.getElementById('l-' + S.settings.terminalLayout)?.focus()) }),
        h('label', { for: 'l-' + k }, label),
      ]))),
    note && h('p', { class: 'tag', style: 'margin:0' }, note))];
}

// ---------- Shell ----------

function render() {
  document.getElementById('n-links').textContent = S.links.filter(l => l.tab === 'links').length;
  document.getElementById('n-apps').textContent = S.links.filter(l => l.tab === 'apps').length;
  document.getElementById('n-ws').textContent = Object.keys(S.workspaces).length;
  document.querySelectorAll('.tab').forEach(t =>
    t.dataset.view === S.view ? t.setAttribute('aria-current', 'page') : t.removeAttribute('aria-current'));
  document.getElementById('q').placeholder = S.view === 'ws' ? 'Search workspaces' : 'Search names, paths, tags';
  document.querySelector('.search').hidden = S.view === 'settings';

  const main = document.getElementById('main');
  main.removeAttribute('aria-busy');
  main.replaceChildren(
    h('h1', null, TITLES[S.view]),
    ...(S.view === 'ws' ? wsView() : S.view === 'settings' ? settingsView() : linksView()));
}

document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => {
  if (S.view === t.dataset.view) return;
  S.view = t.dataset.view;
  // Per-tab state: an open add form or tag filter belongs to the tab it was opened on.
  S.adding = false; S.addErr = ''; S.tag = null; S.editing = null; S.confirming = null;
  S.editWs = null; S.renamingWs = null; S.confirmWs = null;
  if (TAB_KINDS[S.view]) S.addKind = TAB_KINDS[S.view][0];
  render();
}));
// Coming back to the page re-checks paths and picks up CLI changes, unless something is being edited.
// Re-renders only on a real change: replacing the DOM mid-click would swallow the click that focused the window.
const busy = () => Boolean(S.adding || S.editing || S.newWs || S.editWs || S.renamingWs || S.confirming || S.confirmWs ||
  document.querySelector('main :is(input, select):focus'));
window.addEventListener('focus', () => { if (!busy()) load(busy); });
document.getElementById('q').addEventListener('input', e => { S.q = e.target.value; render(); });
document.addEventListener('keydown', e => {
  const typing = /^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement?.tagName);
  if (e.key === '/' && !typing && S.view !== 'settings') { e.preventDefault(); document.getElementById('q').focus(); }
  else if (e.key === 'n' && !typing && !e.ctrlKey && !e.metaKey && TAB_KINDS[S.view]) { e.preventDefault(); openPanel('adding', 'add-name'); }
  else if (e.key === 'Escape' && document.activeElement?.id === 'q') { e.target.value = S.q = ''; e.target.blur(); render(); }
});

load();
</script>
</body>
