<!doctype html>
<html lang="en" data-theme="__THEME__" data-accent="__ACCENT__" data-density="__DENSITY__" data-paths="__PATHS__">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>upex</title>
<meta name="color-scheme" content="dark light">
<style>
/* light-dark(light, dark): the Theme setting picks the scheme, System follows the OS. */
:root { color-scheme: light dark; }
:root[data-theme="light"] { color-scheme: light; }
:root[data-theme="dark"] { color-scheme: dark; }
:root {
  --bg: light-dark(#f6f6f4, #0e1012);
  --panel: light-dark(#ffffff, #15181b);
  --raise: light-dark(#eeeeeb, #1c2024);
  --line: light-dark(#e0e0dc, #262b31);
  --line-strong: light-dark(#c9c9c4, #353c43);
  --text: light-dark(#1a1c1e, #e4e7ea);
  --muted: light-dark(#5a6168, #9aa3ac);
  --accent-soft: color-mix(in srgb, var(--accent) 12%, transparent);
  --warn: light-dark(#8a6100, #f0c050);
  --warn-soft: light-dark(rgba(176, 125, 0, .1), rgba(240, 192, 80, .1));
  --danger: light-dark(#c0352b, #ff7a72);
  --danger-soft: light-dark(rgba(192, 53, 43, .08), rgba(255, 122, 114, .12));
  --sans: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", sans-serif;
  --mono: "Cascadia Mono", "Cascadia Code", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r: 6px;
  --h: 32px; /* control height */
  --pad: 9px; /* list row padding */
}
/* Accent setting; the .ac-* classes color the swatches in Settings. */
/* Default is green here, plain in the terminal. */
:root, .ac-default, .ac-green { --accent: light-dark(#0c8455, #46d39a); --accent-ink: light-dark(#ffffff, #052016); }
:root[data-accent="blue"], .ac-blue { --accent: light-dark(#1f6fd1, #5aa9ff); --accent-ink: light-dark(#ffffff, #04172b); }
:root[data-accent="purple"], .ac-purple { --accent: light-dark(#7445d6, #b18cff); --accent-ink: light-dark(#ffffff, #1a0b33); }
:root[data-accent="orange"], .ac-orange { --accent: light-dark(#b85a00, #ff9f4a); --accent-ink: light-dark(#ffffff, #2b1300); }
:root[data-density="compact"] { --h: 28px; --pad: 4px; }

* { box-sizing: border-box; }
html { scrollbar-color: var(--line-strong) var(--bg); }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 14px/1.45 var(--sans);
  -webkit-font-smoothing: antialiased;
}
::selection { background: var(--accent-soft); color: var(--text); }
input, select, button { font: inherit; color: inherit; }
input, select { caret-color: var(--accent); accent-color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.i { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.mono { font-family: var(--mono); font-size: 12.5px; }

/* Shell: sidebar with the views (Settings sections nest under it), then a sticky title + search bar over the content */
.app { display: grid; grid-template-columns: 216px minmax(0, 1fr); min-height: 100vh; }
.side {
  position: sticky; top: 0; height: 100vh; overflow-y: auto; display: flex; flex-direction: column; gap: 16px;
  padding: 14px 10px; background: var(--panel); border-right: 1px solid var(--line);
}
.brand { font-weight: 700; font-size: 16px; letter-spacing: -.01em; display: flex; align-items: center; gap: 8px; padding: 4px 10px; }
.brand::before { content: ""; width: 8px; height: 8px; border-radius: 2px; background: var(--accent); }
.side nav { display: grid; gap: 2px; }
.tab {
  background: none; border: 0; padding: 7px 10px; border-radius: var(--r); width: 100%; text-align: left;
  color: var(--muted); cursor: pointer; display: flex; gap: 10px; align-items: center;
}
.tab:hover { color: var(--text); background: var(--raise); }
.tab[aria-current="page"] { color: var(--text); background: var(--raise); font-weight: 600; }
.tab[aria-current="page"] .i { color: var(--accent); }
.tab .n { margin-left: auto; font-size: 12px; font-weight: 400; color: var(--muted); font-variant-numeric: tabular-nums; }
.sub { display: grid; gap: 1px; margin: 2px 0 4px 26px; padding-left: 10px; border-left: 1px solid var(--line); }
.sub a { color: var(--muted); text-decoration: none; padding: 4px 8px; border-radius: 4px; font-size: 13px; }
.sub a:hover { color: var(--text); background: var(--raise); }
/* Version at the sidebar's foot; a newer one on npm adds its install command */
.ver { margin-top: auto; padding: 4px 10px; font-size: 12px; color: var(--muted); display: grid; gap: 6px; justify-items: start; }
.ver .upd { color: var(--warn); }
.ver button { all: unset; cursor: pointer; font: 11.5px/1.5 var(--mono); color: var(--text); background: var(--warn-soft); border-radius: 4px; padding: 3px 6px; overflow-wrap: anywhere; }
.ver button:hover { outline: 1px solid var(--warn); }
.ver button:focus-visible { outline: 2px solid var(--accent); }
header {
  position: sticky; top: 0; z-index: 2;
  background: color-mix(in srgb, var(--bg) 92%, transparent);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--line);
}
.bar { max-width: 1600px; padding: 12px 32px; display: flex; align-items: center; gap: 16px; min-height: 57px; }
h1 { font-size: 18px; letter-spacing: -.015em; margin: 0; }
.search { margin-left: auto; position: relative; width: min(440px, 45vw); }
.search .i { position: absolute; left: 9px; top: 50%; transform: translateY(-50%); color: var(--muted); }
.search input[type="search"] { width: 100%; padding-left: 32px; padding-right: 28px; }
.search kbd {
  position: absolute; right: 7px; top: 50%; transform: translateY(-50%);
  font: 11px var(--mono); color: var(--muted); border: 1px solid var(--line-strong); border-radius: 4px; padding: 0 5px;
}
/* Token and key hint, while the empty search has focus */
.search .hint {
  display: none; position: absolute; top: calc(100% + 6px); left: 0; right: 0; z-index: 3;
  background: var(--panel); border: 1px solid var(--line-strong); border-radius: var(--r);
  padding: 6px 10px; font: 12.5px/1.6 var(--mono); color: var(--muted); box-shadow: 0 6px 18px rgba(0, 0, 0, .14); white-space: pre-wrap;
}
.search:focus-within:has(input:placeholder-shown) .hint:not(:empty) { display: block; }

/* Controls */
input[type="text"], input[type="number"], input[type="search"], select {
  background: var(--panel); border: 1px solid var(--line-strong); border-radius: var(--r);
  padding: 6px 9px; min-width: 0; height: var(--h);
}
input::placeholder { color: var(--muted); opacity: .8; }
input:hover, select:hover { border-color: var(--muted); }
input[aria-invalid="true"] { border-color: var(--danger); }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  height: var(--h); padding: 0 12px; border-radius: var(--r); cursor: pointer; white-space: nowrap;
  background: var(--raise); border: 1px solid var(--line-strong);
  transition: background-color .15s ease-out, border-color .15s ease-out, color .15s ease-out;
}
.btn:hover { border-color: var(--muted); }
.btn:disabled, .btn[aria-disabled="true"] { opacity: .5; cursor: default; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { color: var(--danger); }
.btn.danger.solid { background: var(--danger); border-color: var(--danger); color: var(--bg); font-weight: 600; }
.btn.ghost { background: none; border-color: transparent; color: var(--muted); }
.btn.ghost:hover { color: var(--text); background: var(--raise); }
.btn.icon { width: var(--h); padding: 0; }
.btn.icon[aria-pressed="true"] { color: var(--accent); }
.btn.ghost.danger:hover { color: var(--danger); background: var(--danger-soft); }

main { max-width: 1600px; padding: 20px 32px 96px; }
.set-main { max-width: 980px; }
.lede { color: var(--muted); margin: 0 0 16px; }
.toolbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
.toolbar .grow { flex: 1; }

/* Tag filter */
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip {
  border: 1px solid var(--line-strong); background: none; border-radius: 99px;
  padding: 2px 10px; font-size: 12.5px; color: var(--muted); cursor: pointer;
}
.chip:hover { color: var(--text); }
.chip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--text); }

/* Notice for broken paths */
.notice {
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  border: 1px solid color-mix(in srgb, var(--warn) 40%, transparent); background: var(--warn-soft);
  border-radius: var(--r); padding: 10px 12px; margin-bottom: 12px;
}
.notice .i { color: var(--warn); }
.notice p { margin: 0; flex: 1; min-width: 200px; }
/* Suggested shortcut (a folder learned from upex cd): a dashed, empty slot */
.notice.tip { border: 1px dashed var(--line-strong); background: none; padding-block: 8px; }
.notice.tip .i { color: inherit; }
.notice.tip > .i, .notice.tip .mono { color: var(--muted); }
.notice.tip .mono { margin-left: 6px; overflow-wrap: anywhere; }

/* Forms (inline, never modal) */
.form {
  border: 1px solid var(--line-strong); background: var(--panel); border-radius: var(--r);
  padding: 14px; margin-bottom: 12px; display: grid; gap: 10px;
}
.form .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.form .row > input { flex: 1 1 160px; }
.form .row > .wide { flex: 3 1 260px; }
.form .err { color: var(--danger); margin: 0; font-size: 13px; }
/* Labelled fields in the add and edit forms */
.fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 12px; }
.fld { display: grid; gap: 4px; min-width: 0; }
.fld > span { font-size: 13px; color: var(--muted); }
.fld.full { grid-column: 1 / -1; }
.seg { display: inline-flex; flex-wrap: wrap; background: var(--raise); border: 1px solid var(--line); border-radius: var(--r); padding: 2px; gap: 2px; }
.seg label { display: flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 4px; cursor: pointer; color: var(--muted); transition: background-color .15s ease-out, color .15s ease-out; }
.seg label:hover { color: var(--text); }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg input:checked + label { background: var(--panel); color: var(--text); box-shadow: 0 0 0 1px var(--line-strong), 0 1px 2px rgba(0, 0, 0, .12); }
.seg input:focus-visible + label { outline: 2px solid var(--accent); }

/* Settings: one panel of label | control rows per section */
.set-sec { scroll-margin-top: 76px; margin-bottom: 36px; }
.set-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.set-head h2 { font-size: 16px; letter-spacing: -.01em; margin: 0; }
.set-desc { color: var(--muted); margin: 4px 0 12px; max-width: 70ch; }
.set-panel { border: 1px solid var(--line); border-radius: var(--r); background: var(--panel); }
.set-row { display: grid; grid-template-columns: minmax(160px, 220px) minmax(0, 1fr); gap: 8px 24px; align-items: center; padding: 12px 16px; }
.set-row + .set-row, .set-panel > .set-note { border-top: 1px solid var(--line); }
.set-name { font-weight: 600; display: block; }
.set-help { color: var(--muted); font-size: 13px; display: block; margin-top: 1px; }
.set-ctl { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; min-width: 0; }
.set-ctl select { min-width: 200px; }
.set-note { margin: 0; padding: 10px 16px; color: var(--muted); font-size: 13px; background: color-mix(in srgb, var(--raise) 50%, transparent); }
.set-panel > .list { border: 0; border-radius: 0; background: none; }
/* Insights: stats bars and doctor checks */
.ins { padding: 12px 16px; display: grid; gap: 6px; }
.ins + .ins { border-top: 1px solid var(--line); }
.ins h3 { font-size: 13px; margin: 0 0 4px; color: var(--muted); font-weight: 600; }
.ins p { margin: 0; color: var(--muted); font-size: 13px; }
.ins .err { color: var(--danger); }
.st-row { display: grid; grid-template-columns: minmax(80px, 180px) minmax(40px, 1fr) 3ch minmax(0, 130px); gap: 12px; align-items: center; }
.st-row .name, .st-row .when { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.st-bar { height: 6px; border-radius: 3px; background: var(--accent); min-width: 2px; }
.st-n { text-align: right; font-variant-numeric: tabular-nums; }
.weeks { display: flex; align-items: flex-end; gap: 3px; height: 32px; }
.weeks span { width: 14px; border-radius: 2px 2px 0 0; background: var(--accent); min-height: 2px; }
.weeks span.z { background: var(--line-strong); }
.dr-row { display: grid; grid-template-columns: 44px minmax(100px, 160px) minmax(0, 1fr); gap: 12px; align-items: baseline; }
.dr-row .detail { color: var(--muted); overflow-wrap: anywhere; font-size: 13px; }
.dr-s { font: 11.5px var(--mono); text-transform: uppercase; color: var(--muted); }
.dr-s.ok { color: var(--accent); } .dr-s.warn { color: var(--warn); } .dr-s.fail { color: var(--danger); }

/* Shortcut list */
.list { border: 1px solid var(--line); border-radius: var(--r); background: var(--panel); overflow: hidden; }
.item {
  display: grid; grid-template-columns: 18px minmax(120px, 1.1fr) minmax(0, 2.2fr) 64px auto;
  align-items: center; gap: 14px; padding: var(--pad) 12px; border-top: 1px solid var(--line);
}
.item:first-child, .group:first-child { border-top: 0; }
.group .n { margin-left: 8px; opacity: .7; font-variant-numeric: tabular-nums; }
.group { padding: 6px 12px; font-size: 12px; color: var(--muted); border-top: 1px solid var(--line); background: var(--raise); }
.item:hover { background: color-mix(in srgb, var(--raise) 55%, transparent); }
.item:focus { outline: none; }
.item:focus-visible { background: var(--accent-soft); outline: 2px solid var(--accent); outline-offset: -2px; }
.name > button { all: unset; cursor: pointer; }
.name > button:hover { text-decoration: underline; text-underline-offset: 3px; }
.name > button:disabled { cursor: default; text-decoration: none; }
.name > .i { color: var(--accent); vertical-align: -2px; margin-right: 4px; width: 14px; height: 14px; }
/* Row "More" menu (native popover, placed by JS under its button) */
.menu {
  inset: auto; margin: 0; min-width: 210px; padding: 4px;
  background: var(--panel); color: var(--text); border: 1px solid var(--line-strong); border-radius: var(--r);
  box-shadow: 0 8px 28px rgba(0, 0, 0, .22);
}
.menu-open { display: flex; flex-wrap: wrap; gap: 6px; padding: 6px 6px 8px; border-bottom: 1px solid var(--line); margin-bottom: 4px; }
.menu-open select { flex: 1 1 100%; }
.menu-open input.count { width: 64px; }
.menu-open input.start { flex: 1; min-width: 0; }
.menu > button {
  display: flex; width: 100%; align-items: center; gap: 10px; padding: 6px 8px; border: 0; border-radius: 4px;
  background: none; cursor: pointer; text-align: left;
}
.menu > button:hover, .menu > button:focus-visible { background: var(--raise); outline: none; }
.menu > button kbd { margin-left: auto; font: 11px var(--mono); color: var(--muted); }
.menu > button.danger { color: var(--danger); }
.menu > hr { border: 0; border-top: 1px solid var(--line); margin: 4px 0; }
.menu { max-height: calc(100vh - 16px); overflow-y: auto; }
.menu-h { padding: 4px 8px 2px; font-size: 12px; color: var(--muted); }
.menu > button.mono { font-size: 12.5px; }
/* Open upgo goals of a folder, one line under the name */
.goals .gn { color: var(--accent); font-variant-numeric: tabular-nums; margin-right: 2px; }
.item > .kind { display: flex; color: var(--muted); }
.item.broken > .kind { color: var(--warn); }
.name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tags { display: flex; gap: 4px; margin-top: 2px; flex-wrap: wrap; }
.tag { font-size: 12px; color: var(--muted); }
.note { font-size: 12px; color: var(--muted); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.target { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: ltr; }
.target .miss { color: var(--warn); font-family: var(--sans); font-size: 12px; margin-right: 8px; }
/* Paths setting: dim parent folders (default), full, or hidden */
.target .leaf, :root[data-paths="full"] .target { color: var(--text); }
:root[data-paths="hidden"] .item > .target { display: none; }
:root[data-paths="hidden"] .item:not(.editing) { grid-template-columns: 18px minmax(120px, 1fr) 64px auto; }
.swatch { width: 10px; height: 10px; border-radius: 3px; background: var(--accent); }
.custom-accent {
  display: inline-flex; align-items: center; gap: 6px; height: var(--h); padding: 0 10px 0 4px; cursor: pointer;
  color: var(--muted); border: 1px solid var(--line-strong); border-radius: var(--r); font-family: var(--mono); font-size: 12.5px;
}
.custom-accent:hover { color: var(--text); }
.custom-accent.on { color: var(--text); border-color: var(--accent); background: var(--accent-soft); }
.custom-accent input { width: 22px; height: 22px; padding: 0; border: 0; background: none; cursor: pointer; }
.dot { margin-right: 6px; font-weight: 400; }
/* Color labels (store COLORS); a hex comes inline */
.c-red { color: light-dark(#d13438, #ff6b6b); } .c-orange { color: light-dark(#c75000, #ff9f45); } .c-yellow { color: light-dark(#a67c00, #f5cf3c); }
.c-green { color: light-dark(#1f8a3b, #5dd27a); } .c-blue { color: light-dark(#1f6feb, #6aa7ff); } .c-purple { color: light-dark(#8250df, #c08bff); }
.c-gray { color: var(--muted); }
.when { color: var(--muted); font-size: 12px; text-align: right; font-variant-numeric: tabular-nums; }
.actions { display: flex; gap: 4px; align-items: center; justify-content: flex-end; }
[hidden] { display: none !important; }
.item.editing { grid-template-columns: 1fr; background: var(--raise); }
.item.editing .form { margin: 0; border: 0; padding: 4px 0; background: none; }
.confirm { display: flex; gap: 6px; align-items: center; }
.confirm span { color: var(--danger); margin-right: 4px; }

.empty { text-align: center; padding: 48px 24px; color: var(--muted); }
.empty strong { display: block; color: var(--text); font-size: 15px; margin-bottom: 4px; }
.empty .btn { margin-top: 14px; }

/* Workspaces */
.ws { border: 1px solid var(--line); border-radius: var(--r); background: var(--panel); margin-bottom: 12px; }
.ws-head { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--line); }
.ws-head h2 { font-size: 15px; margin: 0; flex: 1; }
.ws-head input { flex: 1; }
.ws-entry { display: grid; grid-template-columns: minmax(100px, 1fr) minmax(100px, 1fr) minmax(0, 2fr) auto; gap: 12px; align-items: center; padding: calc(var(--pad) - 2px) 12px; border-bottom: 1px solid var(--line); }
.ws-entry .muted { color: var(--muted); }
.ws-add { padding: 10px 12px; display: flex; gap: 8px; flex-wrap: wrap; }
.ws-add select, .ws-add input { flex: 1 1 120px; }
.ws-add input.count { flex: 0 0 72px; }
.ws-add input.start { flex: 2 1 200px; }
.ws-add.editing { background: var(--raise); border-bottom: 1px solid var(--line); }
.ws-entry.op { grid-template-columns: minmax(100px, 1fr) minmax(0, 3fr) auto; }
.ws-entry.op .confirm { grid-column: span 2; justify-content: flex-end; flex-wrap: wrap; }

/* Status line */
#status {
  position: fixed; left: 50%; bottom: 20px; transform: translate(-50%, 12px); opacity: 0;
  background: var(--raise); border: 1px solid var(--line-strong); border-radius: var(--r);
  padding: 8px 14px; box-shadow: 0 6px 24px rgba(0, 0, 0, .28); max-width: calc(100vw - 32px);
  transition: opacity .18s cubic-bezier(.16, 1, .3, 1), transform .18s cubic-bezier(.16, 1, .3, 1);
  pointer-events: none;
}
#status.show { opacity: 1; transform: translate(-50%, 0); }
#status.undo { pointer-events: auto; display: flex; align-items: center; gap: 10px; padding-block: 4px; }
#status.error { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 50%, transparent); }

@media (max-width: 760px) {
  /* The sidebar turns into a top row of tabs. */
  .app { grid-template-columns: minmax(0, 1fr); }
  .side { position: static; height: auto; flex-direction: row; align-items: center; gap: 8px; padding: 8px 12px; border-right: 0; border-bottom: 1px solid var(--line); overflow-x: auto; }
  .side nav { display: flex; }
  .brand { padding: 4px 6px; }
  .tab { width: auto; white-space: nowrap; }
  .tab .i, .sub, .ver button { display: none; }
  .ver { margin: 0 0 0 auto; white-space: nowrap; }
  .bar { flex-wrap: wrap; padding: 10px 16px; gap: 10px; }
  .search { width: 100%; order: 3; }
  .search kbd { display: none; }
  main { padding: 16px 16px 96px; }
  .item { grid-template-columns: 18px minmax(0, 1fr) auto; grid-template-areas: "i n w" "i t t" "a a a"; row-gap: 6px; }
  .item > .kind { grid-area: i; align-self: start; margin-top: 3px; }
  .item > .nm { grid-area: n; min-width: 0; }
  .item > .target { grid-area: t; }
  .item > .when { grid-area: w; }
  .item > .actions { grid-area: a; justify-content: flex-start; flex-wrap: wrap; }
  :root[data-paths="hidden"] .item:not(.editing) { grid-template-columns: 18px minmax(0, 1fr) auto; grid-template-areas: "i n w" "a a a"; }
  .ws-entry { grid-template-columns: 1fr 1fr auto; }
  .ws-entry .start { grid-column: 1 / 3; }
  .fields { grid-template-columns: minmax(0, 1fr); }
  .set-row { grid-template-columns: minmax(0, 1fr); padding: 12px; }

<script nonce="__NONCE__">
const TOKEN = '__TOKEN__';

const TITLES = { links: 'Shortcuts', apps: 'Apps', ws: 'Workspaces', settings: 'Settings' };
const SETTING_OPTS = {
  startView: { shortcuts: 'Shortcuts', apps: 'Apps', workspaces: 'Workspaces', last: 'Last used' },
  sort: { recent: 'Most used', name: 'A to Z', opened: 'Last opened', added: 'Recently added' },
  views: { all: 'All', 'no-workspaces': 'No Workspaces', 'no-apps': 'No Apps', shortcuts: 'Shortcuts only' },
  searchIn: { all: 'Names, paths, tags', names: 'Names only' },
  staleAfter: { 30: '30 days', 60: '60 days', 90: '90 days', 180: '180 days' },
  terminalLayout: { here: 'This window', windows: 'Separate windows', tabs: 'Tabs', panes: 'Split panes' },
  paneSplit: { auto: 'Auto', vertical: 'Side by side', horizontal: 'Stacked' },
  terminalShell: { cmd: 'cmd', powershell: 'PowerShell', pwsh: 'PowerShell 7', profile: 'WT default profile' },
  theme: { system: 'System', dark: 'Dark', light: 'Light' },
  accent: { default: 'Default', green: 'Green', blue: 'Blue', purple: 'Purple', orange: 'Orange' },
  density: { comfortable: 'Comfortable', compact: 'Compact' },
  paths: { dim: 'Dim folders', full: 'Full', hidden: 'Hidden' },
  rowDetails: { both: 'Both', tags: 'Tags', badges: 'Badges', none: 'None' },
  usage: { ago: 'Last opened', opens: 'Opens', off: 'Off' },
  pinned: { top: 'On top', section: 'Own section' },
  groups: { off: 'Off', tags: 'By tag' },
  // Pairs, as an object would list numeric keys before off.
  goals: [['off', 'Off'], ['3', '3'], ['5', '5'], ['10', '10']],

const shows = what => [undefined, 'both', what].includes(S.settings.rowDetails);

const LOOK = ['theme', 'accent', 'density', 'paths'];
// The archived toggle swaps the tab's list for its archived shortcuts.
const tabLinks = (archived = S.archived) => S.links.filter(l => l.tab === S.view && l.archived === archived);
const COPY_WORD = { folder: 'path', app: 'path', cmd: 'command', url: 'URL' };
// config startView -> page tab
const START_TAB = { shortcuts: 'links', apps: 'apps', workspaces: 'ws' };
// Views setting -> page tabs it hides.
const HIDES = { 'no-workspaces': ['ws'], 'no-apps': ['apps'], shortcuts: ['apps', 'ws'] };
// Sort setting -> field, highest first; A to Z has none.
const SORT_FIELD = { recent: 'score', opened: 'lastUsed', added: 'added' };
const isHex = v => /^#[0-9a-f]{6}$/i.test(v || '');
const COLORS = ['red', 'orange', 'yellow', 'green', 'blue', 'purple', 'gray'];
// Color label before the name: a palette or hex dot, or the emoji itself.
const dot = c => c && h('span', { class: 'dot' + (COLORS.includes(c) ? ' c-' + c : ''), style: isHex(c) ? 'color:' + c : null, 'aria-hidden': 'true' },
  COLORS.includes(c) || isHex(c) ? '●' : c);
// Usage setting: last opened, open count or nothing, like the selector.
const usage = l => (S.settings.usage === 'off' ? '' : S.settings.usage === 'opens' ? `${l.uses} open${l.uses === 1 ? '' : 's'}` : ago(l.lastUsed));

const S = {
  version: '', update: null, links: [], suggest: null, workspaces: {}, apps: [], openers: [], settings: {}, defaults: {}, startTab: '', wt: null, home: '', sep: '/',
  view: null, q: '', tag: null, archived: false,
  adding: false, addKind: 'folder', addErr: '', add: { name: '', target: '', tags: '', opener: '' },
  editing: null, draft: null, editErr: '',
  confirming: null, confirmWs: null, editWs: null, renamingWs: null, wsNewName: '',
  // Keyed by user names, so no prototype ("constructor" etc.).
  openWith: Object.create(null), openCount: Object.create(null), openStart: Object.create(null),
  wsDraft: Object.create(null), newWs: false, newWsName: '',
  opDraft: { name: '', command: '' }, editOp: null, editOpCmd: '', confirmOp: null, insights: null,

// DOM builder; text always goes in as text nodes, never HTML.
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'class') el.className = v;
    else if (k === 'value') el.value = v;
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat(Infinity)) if (kid != null && kid !== false) el.append(kid);
  return el;
}
function icon(name) {
  const s = document.createElementNS(NS, 'svg');
  s.setAttribute('class', 'i');
  s.setAttribute('aria-hidden', 'true');
  const u = document.createElementNS(NS, 'use');
  u.setAttribute('href', '#i-' + name);
  s.append(u);
  return s;
}

  h('button', { type: 'button', class: 'btn ' + (cls || ''), onclick, ...extra }, ico && icon(ico), label);
// A visible label over a form control.
const fld = (label, input, full) => h('label', { class: 'fld' + (full ? ' full' : '') }, h('span', null, label), input);
// Open a panel, then focus its first field (only on open, so re-renders never steal focus).
function openPanel(key, id) {
  S[key] = true;
  render();
  document.getElementById(id)?.focus();
}

const iconBtn = (ico, label, cls, onclick, extra) =>
  h('button', { type: 'button', class: 'btn icon ghost ' + (cls || ''), 'aria-label': label, title: label, onclick, ...extra }, icon(ico));

async function api(method, path, body) {
  const res = await fetch('/api/' + path, {
    method,
    headers: { 'content-type': 'application/json', 'x-upex-token': TOKEN },
    body: body && JSON.stringify(body),
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || `Request failed (${res.status})`);
  return data;
}

let statusTimer;
// `undo`: the toast gets an Undo button; true steps back one links.json backup like upex undo, a function runs that instead.
const copyText = t => Promise.resolve().then(() => navigator.clipboard.writeText(t))
  .then(() => say('Copied ' + t), () => say('Could not copy to the clipboard.', true));

function say(msg, isError, undo) {
  const el = document.getElementById('status');
  el.replaceChildren(msg);
  const back = typeof undo === 'function' ? undo : () => api('POST', 'undo');
  // Gone on click, so a second Enter can't undo one more step while the request runs.
  if (undo) el.append(btn('Undo', 'ghost', e => { el.className = ''; e.currentTarget.remove(); act(back, 'Undone'); }));
  el.className = 'show' + (isError ? ' error' : '') + (undo ? ' undo' : '');
  clearTimeout(statusTimer);
  statusTimer = setTimeout(() => { el.className = isError ? 'error' : ''; el.querySelector('button')?.remove(); }, isError || undo ? 6000 : 2600);
}

// Last loaded state minus the time-based score, so a no-op refresh can skip the re-render.
let seen = '';
const stamp = s => JSON.stringify(s, (k, v) => (k === 'score' ? undefined : v));
// With `skip`, a quiet refresh: no re-render when nothing changed or skip() is true by the time it lands.
async function load(skip) {
  try {
    const s = await api('GET', 'state');
    if (skip && (stamp(s) === seen || skip())) return;
    seen = stamp(s);
    Object.assign(S, s);
  } catch (e) {
    say(e.message, true);
    if (skip) return;
  }
  if (!S.view) {
    S.view = START_TAB[S.startTab] || 'links';
    if (TAB_KINDS[S.view]) S.addKind = TAB_KINDS[S.view][0];
  }
  render();
}

// Run an action, report it, reload. Returns true on success.
async function act(fn, okMsg, undo) {
  try {
    await fn();
    if (okMsg) say(okMsg, false, undo);
    await load();
    return true;
  } catch (e) {
    say(e.message, true);
    await load();
    return false;
  }
}

function ago(t) {
  if (!t) return 'never';
  const m = (Date.now() - t) / 60000;
  if (m < 1) return 'now';
  if (m < 60) return Math.floor(m) + 'm ago';
  if (m < 1440) return Math.floor(m / 60) + 'h ago';
  if (m < 43200) return Math.floor(m / 1440) + 'd ago';
  return Math.floor(m / 43200) + 'mo ago';
}

function placeholder(kind) {
  if (kind === 'url') return 'github.com/you/repo';
  if (kind === 'cmd') return 'command line, runs in a terminal, e.g. npm run dev';
  if (kind === 'app') return S.sep === '\\' ? 'C:\\Program Files\\App\\app.exe or a command' : '/usr/bin/app or a command';
  return [S.home, 'projects', 'my-app'].join(S.sep);
}

const appLabel = key => (S.apps.find(a => a.key === key) || {}).label || key;
const isTerm = key => Boolean((S.apps.find(a => a.key === key) || {}).terminal);
// What "Default" opens a folder shortcut in; false = a file's default app.
const dflt = l => l.opener || (!l.file && S.settings.defaultOpener);

// Default opener picker for folder shortcuts ('' = none). Shows the current one even if it's copy or unknown.
const openerSelect = (value, set) => h('select', { onchange: e => set(e.target.value) },
  h('option', { value: '' }, 'Default opener'),
  S.apps.filter(a => a.key !== 'copy' || a.key === value).map(a => h('option', { value: a.key, selected: value === a.key }, a.label)),
  !!value && !S.apps.some(a => a.key === value) && h('option', { value, selected: true }, value + ' (unknown)'));

// ---------- Shortcuts view ----------

// Search tokens, like the selector filter (filterChoices in interactive.js): #tag, @opener, is:pinned|missing|stale|app|new|temp,
// prefix match; a bare #, @ or is: is none, an unknown is:x matches none.
const IS = {
  pinned: l => l.pinned,
  missing: l => l.broken,
  stale: l => Date.now() - (l.lastUsed || l.added) >= Number(S.settings.staleAfter || 60) * 864e5,
  app: l => l.kind === 'app' || l.kind === 'cmd',
  new: l => Date.now() - l.added < 7 * 864e5,
  temp: l => !!l.expires,
};
const SEARCH_TOKEN = /^(#|@|is:)(.*)$/;
function tokenTest(w) {
  const [, kind, v] = w.match(SEARCH_TOKEN);
  if (!v) return () => true;
  if (kind === '#') return l => l.tags.some(t => t.toLowerCase().startsWith(v));
  if (kind === '@') return l => l.opener.toLowerCase().startsWith(v);
  const key = Object.keys(IS).find(k => k.startsWith(v));
  return key ? IS[key] : () => false;
}

function visibleLinks() {
  const words = S.q.trim().toLowerCase().split(/(?=[#@])|(?=is:)|\s+/).filter(Boolean);
  const tests = words.filter(w => SEARCH_TOKEN.test(w)).map(tokenTest);
  const q = words.filter(w => !SEARCH_TOKEN.test(w)).join(' ');
  return tabLinks()
    .filter(l => !S.tag || l.tags.includes(S.tag))
    .filter(l => tests.every(t => t(l)))
    .filter(l => !q || [l.name, ...l.aliases, ...(S.settings.searchIn === 'names' ? [] : [l.target, ...l.tags])].some(s => s.toLowerCase().includes(q)))
    .sort((a, b) => { const f = SORT_FIELD[S.settings.sort]; return b.pinned - a.pinned || Math.sign(pinRank(a) - pinRank(b)) || (f ? b[f] - a[f] : 0) || a.name.localeCompare(b.name); });
}

// Groups setting on a sorted list: [heading, links] with pinned on top, then per tag in list order (A to Z when `byName`),
// a link with two tags under both, untagged last.
function groupLinks(list, byName) {
  const tags = [...new Set(list.flatMap(l => l.tags))];
  if (byName) tags.sort((a, b) => a.localeCompare(b));
  return [['Pinned', list.filter(l => l.pinned)], ...tags.map(t => ['#' + t, list.filter(l => l.tags.includes(t))]),
    ['untagged', list.filter(l => !l.tags.length)]].filter(g => g[1].length);
}

// Pin order from the selector (Alt+Up/Down); unordered pins after.
function pinRank(l) {
  return l.pinOrder ?? Infinity;
}

function addForm() {
  const err = h('p', { class: 'err', role: 'alert' }, S.addErr);
  const d = S.add;
  const field = (key, attrs) => h('input', { type: 'text', value: d[key], spellcheck: 'false', autocomplete: 'off',
    oninput: e => (d[key] = e.target.value), ...attrs });

    kinds.map(k => [k, KINDS[k]]).map(([k, label]) => [
      h('input', { type: 'radio', name: 'kind', id: 'k-' + k, checked: S.addKind === k, onchange: () => {
        S.addKind = k;

      h('label', { for: 'k-' + k }, icon(k), label),

    e.preventDefault();

      await api('POST', 'links', { kind: S.addKind, ...d, opener: S.addKind === 'folder' ? d.opener : undefined });

      fld('Name', field('name', { id: 'add-name', placeholder: 'e.g. web' })),
      h('label', { class: 'fld' }, targetLabel, target),
      fld('Tags', field('tags', { placeholder: 'comma separated' })),
      S.addKind === 'folder' && fld('Opens in', openerSelect(d.opener, v => (d.opener = v)))),
    h('div', { class: 'row' },
      h('button', { type: 'submit', class: 'btn primary' }, icon('plus'), S.view === 'apps' ? 'Add app' : 'Add shortcut'),
      btn('Cancel', 'ghost', () => close())),

}

function editRow(l) {
  const d = S.draft;
  const err = h('p', { class: 'err', role: 'alert' }, S.editErr);
  const field = (key, attrs) => h('input', { type: 'text', value: d[key], spellcheck: 'false', autocomplete: 'off',
    oninput: e => (d[key] = e.target.value), ...attrs });
  const name = field('name', { id: 'edit-name' });
  const save = async (e) => {
    e.preventDefault();
    try {
      await api('PUT', 'links', { old: l.name, ...d });
      say(d.name.trim() !== l.name ? `Renamed ${l.name} to ${d.name.trim()}` : `Saved ${l.name}`);
      S.editing = null; S.editErr = '';
      await load();
    } catch (ex) {
      err.textContent = S.editErr = ex.message;
    }
  };

  return h('div', { class: 'item editing', 'data-name': l.name },
    h('form', { class: 'form', onsubmit: save, onkeydown: e => e.key === 'Escape' && cancel() },
      h('div', { class: 'fields' },
        fld('Name', name),
        fld(l.kind === 'folder' ? 'Folder path' : KINDS[l.kind], field('target', { class: 'mono', placeholder: placeholder(l.kind) })),
        fld('Tags', field('tags', { placeholder: 'comma separated' })),
        fld('Aliases', field('aliases', { placeholder: 'other names, comma separated' })),
        fld('Note', field('note', { placeholder: 'shown under the name', spellcheck: 'true' }), true),
        fld('Color label', field('color', { placeholder: COLORS.join(', ') + ', #hex or emoji', list: 'colors' })),
        h('datalist', { id: 'colors' }, COLORS.map(c => h('option', { value: c }))),
        // Opener is only sent once changed, so a stale one doesn't block saving other edits.
        l.kind === 'folder' && fld('Opens in', openerSelect(d.opener ?? l.opener, v => (d.opener = v)))),
      h('div', { class: 'row' },
        h('button', { type: 'submit', class: 'btn primary' }, icon('check'), 'Save'),
        btn('Cancel', 'ghost', cancel)),
      err));
}

// Target as [parent folders, leaf], like the selector; a URL stays whole.
function splitLeaf(l) {
  const t = l.target;
  const cut = l.kind === 'url' ? 0 : Math.max(t.lastIndexOf('/'), t.lastIndexOf('\\')) + 1;
  return [t.slice(0, cut), h('span', { class: l.kind === 'url' ? null : 'leaf' }, t.slice(cut))];
}

// `again`: a second copy (Groups by tag), which never turns into the edit form.
function row(l, again) {
  if (S.editing === l.name && !again) return editRow(l);

  const confirmDelete = () => { S.confirming = l.name; render(); focusIn(l.name, 'keep'); };
  const edit = () => {
    S.editing = l.name; S.editErr = '';

    // The Open button names a picked opener, so the choice stays visible with the menu closed.

    const openWith = l.kind === 'folder' && h('select', { 'aria-label': `Open ${l.name} with`, onchange: e => {
        S.openWith[l.name] = e.target.value;

      } },
      h('option', { value: '' }, dflt(l) ? 'Default: ' + appLabel(dflt(l)) : 'Default app'),
      S.apps.map(a => h('option', { value: a.key, selected: S.openWith[l.name] === a.key }, a.label)));
    open = () => !l.broken && act(() => api('POST', 'open', {
      name: l.name, app: S.openWith[l.name] || undefined, ...(!count.hidden && { count: count.value, start: start.value }),
    }), `Opened ${l.name}`);
    const copy = () => copyText(l.target);
    const openBtn = btn('', '', open, 'open', { 'data-k': 'open', disabled: l.broken, title: l.broken ? 'Path is missing. Edit it first.' : null });
    openBtn.lastChild.textContent = openLabel();
    actions = h('div', { class: 'actions' }, openBtn,
      moreMenu(l.name, [
        (openWith || !count.hidden) && h('div', { class: 'menu-open' }, openWith, count, start),
        ['pin', l.pinned ? 'Unpin' : 'Pin to top', 'P', () => act(() => api('PUT', 'pin', { name: l.name, pinned: !l.pinned }), `${l.pinned ? 'Unpinned' : 'Pinned'} ${l.name}`)],
        ['copy', 'Copy ' + COPY_WORD[l.kind], '', copy],
        ['edit', 'Edit', 'E', edit],
        // package.json scripts, each runs in a terminal like upex run.
        ...(l.scripts.length ? [null, h('div', { class: 'menu-h' }, `Scripts (${l.pm})`),
          ...l.scripts.map(([n, c]) => ['cmd', n, '', () => act(() => api('POST', 'run', { name: l.name, script: n }), `Running ${l.pm} run ${n} in ${l.name}`), 'mono', c])] : []),
        null,

  }
  // Keys on a focused row; Del archives like the selector. None while it asks to delete.
  const keys = S.confirming === l.name ? {} : { Enter: open, e: edit, F2: edit, p: !l.archived && (() => act(() => api('PUT', 'pin', { name: l.name, pinned: !l.pinned }), `${l.pinned ? 'Unpinned' : 'Pinned'} ${l.name}`)),
    Delete: l.archived ? confirmDelete : () => archive(true) };

  const el = h('div', { class: 'item' + (l.broken ? ' broken' : ''), tabindex: '-1', 'data-name': l.name,
      onkeydown: e => {

        if (fn) { e.preventDefault(); fn(); }

    h('div', { class: 'nm' },

        open ? h('button', { type: 'button', tabindex: '-1', disabled: l.broken, onclick: open }, l.name) : l.name),
      ((shows('tags') && l.tags.length > 0) || l.aliases.length > 0) && h('div', { class: 'tags' },
        l.aliases.length > 0 && h('span', { class: 'tag', title: 'Aliases' }, 'aka ' + l.aliases.join(', ')),
        shows('tags') && l.tags.map(t => h('span', { class: 'tag' }, '#' + t))),
      l.note && h('div', { class: 'note', title: l.note }, l.note),
      // Goals setting: done/total and the next open goals from the folder's goals.json.
      l.goals && h('div', { class: 'note goals', title: l.goals.next.join('\n') || 'All goals done' },
        h('span', { class: 'sr' }, 'Goals done: '), h('span', { class: 'gn' }, `${l.goals.done}/${l.goals.total}`), ' ', l.goals.next.join(' · ') || 'all done')),
    h('div', { class: 'target mono', title: l.target }, l.broken && shows('badges') && h('span', { class: 'miss' }, 'missing'), ...splitLeaf(l)),
    h('div', { class: 'when', title: S.settings.usage === 'opens' ? 'Times opened' : 'Last opened' }, usage(l)),
    actions);
  el.open = open;
  return el;
}

let menuSeq = 0;
// "More" button plus its popover menu: a node goes in as is, [icon, label, key hint, fn, class] is a menu item, null a divider.
function moreMenu(name, items) {
  const id = 'menu-' + ++menuSeq;
  // Focus starts on the first item, not the opener select, where arrows would change the opener.
  const menu = h('div', { class: 'menu', id, popover: 'auto', role: 'group', 'aria-label': `More for ${name}`,
      ontoggle: e => { if (e.newState === 'open') menu.querySelector(':scope > button')?.focus(); },
      onkeydown: e => {
        if (!['ArrowDown', 'ArrowUp'].includes(e.key) || e.target.parentElement !== menu) return;
        e.preventDefault();
        const all = [...menu.querySelectorAll(':scope > button')];
        all[(all.indexOf(e.target) + (e.key === 'ArrowDown' ? 1 : -1) + all.length) % all.length]?.focus();
      } },
    items.filter(x => x !== false && x !== undefined).map(x => (x === null ? h('hr')
      : x instanceof Node ? x
      : h('button', { type: 'button', class: x[4] || null, title: x[5] || null, onclick: () => { menu.hidePopover(); x[3](); } },
        icon(x[0]), x[1], x[2] && h('kbd', null, x[2])))));
  const more = h('button', { type: 'button', class: 'btn icon ghost', 'aria-label': `More for ${name}`, title: 'More',
    popovertarget: id, 'data-k': 'more', onclick: () => place(more, menu) }, icon('more'));
  return [more, menu];
}
// Put a popover under its button, flipped up or left when it would leave the window.
function place(anchor, pop) {
  requestAnimationFrame(() => {
    const a = anchor.getBoundingClientRect();
    const p = pop.getBoundingClientRect();
    pop.style.left = Math.max(8, Math.min(a.right - p.width, innerWidth - p.width - 8)) + 'px';
    pop.style.top = (a.bottom + 4 + p.height > innerHeight - 8 ? Math.max(8, a.top - 4 - p.height) : a.bottom + 4) + 'px';
  });
}

// A folder learned from upex cd, offered as a shortcut: Add opens the add form filled in, Dismiss stops offering it.
function suggestion(s) {
  const hide = hidden => () => api('PUT', 'learned/hide', { path: s.path, hidden });
  return h('div', { class: 'notice tip', role: 'region', 'aria-label': 'Suggested shortcut' },
    icon('folder'),
    h('p', null, 'You cd into ', h('strong', null, s.name), ` often (${s.uses} visits)`, h('span', { class: 'mono' }, s.path)),
    btn('Add shortcut', '', () => {
      S.addKind = 'folder';
      S.add = { name: s.name, target: s.path, tags: '', opener: '' };
      openPanel('adding', 'add-name');
    }, 'plus'),
    // Focus moves to the next suggestion, else the search.
    btn('Dismiss', 'ghost', () => act(hide(true), `Won't suggest ${s.name} again`, hide(false))
      .then(() => (document.querySelector('.tip .btn') || document.getElementById('q'))?.focus())));
}

        : 'A shortcut is a short name for a folder. Open it here or with upex <name> in a terminal.',
      h('div', null, !S.adding && btn(isApps ? 'Add your first app' : 'Add your first shortcut', 'primary', () => openPanel('adding', 'add-name'), 'plus')))));
  } else if (!list.length) {

      h('strong', null, 'Nothing matches'),

      h('div', null, btn('Clear filters', '', () => { S.q = ''; S.tag = null; document.getElementById('q').value = ''; render(); })))));
  } else if (S.settings.groups === 'tags' && !S.q.trim() && !S.tag && list.some(l => l.tags.length)) {

    out.push(h('div', { class: 'list' }, groupLinks(list, S.settings.sort === 'name').map(([g, ls]) => [

// ---------- Workspaces view ----------

// Entry form: adds an entry, or edits one in place when `editing`.
function entryForm(key, init, onSubmit, editing) {
  const d = S.wsDraft[key] ||= { shortcut: '', app: '', count: '', start: '', ...init };
  const set = k => e => (d[k] = e.target.value);
  const names = S.links.filter(l => !l.archived).map(l => l.name).sort((a, b) => a.localeCompare(b));
  // Keep a missing shortcut selectable so editing doesn't silently drop it.
  if (d.shortcut && !names.includes(d.shortcut)) names.unshift(d.shortcut);
  const cancel = () => { delete S.wsDraft[key]; S.editWs = null; render(); };
  return h('form', { class: 'ws-add' + (editing ? ' editing' : ''), onkeydown: e => editing && e.key === 'Escape' && cancel(), onsubmit: async e => {
      e.preventDefault();
      if (!d.shortcut) return say('Pick a shortcut first', true);
      // onSubmit already re-rendered with this draft; clear it and render again.
      if (await onSubmit({ ...d })) { delete S.wsDraft[key]; render(); }
    } },
    h('select', { id: editing ? 'ws-edit-first' : null, 'aria-label': 'Shortcut', onchange: set('shortcut') },
      h('option', { value: '' }, 'Shortcut…'),
      names.map(n => h('option', { value: n, selected: d.shortcut === n }, n))),
    h('select', { 'aria-label': 'Open with', onchange: set('app') },
      h('option', { value: '' }, 'Default opener'),
      S.apps.map(a => h('option', { value: a.key, selected: d.app === a.key }, a.label))),
    h('input', { type: 'number', class: 'count', min: 1, max: 9, placeholder: 'x1', value: d.count, 'aria-label': 'Window count (terminals)', oninput: set('count') }),
    h('input', { type: 'text', class: 'start mono', placeholder: 'start command, e.g. claude (terminals)', value: d.start, spellcheck: 'false', 'aria-label': 'Start command', oninput: set('start') }),
    h('button', { type: 'submit', class: 'btn' + (editing ? ' primary' : '') }, icon(editing ? 'check' : 'plus'), editing ? 'Save' : 'Add entry'),
    editing && btn('Cancel', 'ghost', cancel));
}

// prev: the list this page saw (null = new); the server refuses if it changed since.
// `undoable`: the toast's Undo puts `prev` back (workspaces live in config.json, which upex undo doesn't cover).
// Its own `prev` is the list right after this save, so a change since (CLI, then a reload) refuses instead of being overwritten.
async function saveWs(name, entries, msg, prev, undoable) {
  let after;
  const ok = await act(() => api('PUT', 'workspace', { name, entries, prev }), msg,
    undoable && (() => api('PUT', 'workspace', { name, entries: prev, prev: after })));
  after = S.workspaces[name] ?? null;
  return ok;
}
const confirmWsDelete = name => { S.confirmWs = name; render(); document.getElementById('ws-keep')?.focus(); };
function wsHead(name, entries) {
  if (S.confirmWs === name) {
    return h('div', { class: 'ws-head' }, h('h2', null, name),
      h('div', { class: 'confirm' }, h('span', null, `Delete workspace ${name}?`),
        btn('Delete', 'danger solid', () => { S.confirmWs = null; saveWs(name, [], `Deleted ${name}`, entries, true); }),
        btn('Keep', 'ghost', () => { S.confirmWs = null; render(); }, null, { id: 'ws-keep' })));
  }
  if (S.renamingWs === name) {
    const cancel = () => { S.renamingWs = null; render(); };
    return h('form', { class: 'ws-head', onkeydown: e => e.key === 'Escape' && cancel(), onsubmit: async e => {
        e.preventDefault();
        const to = S.wsNewName.trim();
        if (to === name) return cancel();
        const ok = await act(() => api('PUT', 'workspace', { name, newName: to, entries, prev: entries }), `Renamed ${name} to ${to}`);
        if (ok) { S.renamingWs = null; render(); }
      } },
      h('input', { type: 'text', id: 'ws-rename', value: S.wsNewName, spellcheck: 'false', autocomplete: 'off', 'aria-label': `New name for ${name}`,
        oninput: e => (S.wsNewName = e.target.value) }),
      h('button', { type: 'submit', class: 'btn primary' }, icon('check'), 'Rename'),
      btn('Cancel', 'ghost', cancel));
  }
  return h('div', { class: 'ws-head' }, h('h2', null, name),
    btn('Open all', 'primary', () => act(() => api('POST', 'workspace/open', { name }), `Opened ${name}`), 'open'),
    iconBtn('edit', `Rename workspace ${name}`, '', () => {
      S.renamingWs = name; S.wsNewName = name;
      render();
      document.getElementById('ws-rename')?.select();
    }),
    iconBtn('trash', `Delete workspace ${name}`, 'danger', () => confirmWsDelete(name)));
}

function wsBlock(name, entries) {
  const known = new Set(S.links.filter(l => !l.archived).flatMap(l => [l.name, ...l.aliases]));
  const shelved = new Set(S.links.filter(l => l.archived).flatMap(l => [l.name, ...l.aliases]));
  const move = async (i, by) => {
    const next = [...entries];
    [next[i], next[i + by]] = [next[i + by], next[i]];
    const label = up => `Move ${entries[i].shortcut} ${up ? 'up' : 'down'}`;
    await saveWs(name, next, label(by < 0).replace('Move', 'Moved'), entries);
    // Keep keyboard focus on the moved entry (the other arrow once it hits an end).
    const btns = [...document.querySelectorAll('section.ws button:enabled')].filter(b => b.closest('section').getAttribute('aria-label') === name);
    const find = up => btns.find(b => b.getAttribute('aria-label') === label(up));
    (find(by < 0) || find(by > 0))?.focus();
  };
  // Includes the entry itself, so a reorder or outside change can't point an open edit at another entry.
  const editKey = i => `${name}\0${i}\0${JSON.stringify(entries[i])}`;
  return h('section', { class: 'ws', 'aria-label': name },
    wsHead(name, entries),
    entries.map((e, i) => S.editWs === editKey(i)
      ? entryForm(editKey(i), { shortcut: e.shortcut, app: e.app || '', count: e.count > 1 ? String(e.count) : '', start: e.start || '' },
          async d => {
            const ok = await saveWs(name, entries.map((x, j) => (j === i ? d : x)), `Saved ${d.shortcut}`, entries);
            if (ok) S.editWs = null;
            return ok;
          }, true)
      : h('div', { class: 'ws-entry' },
        h('span', { class: 'name' }, e.shortcut, !known.has(e.shortcut) && (shelved.has(e.shortcut)
          ? h('span', { class: 'tag', title: 'Restore it to open it here' }, ' (archived)')
          : h('span', { class: 'tag', title: 'No shortcut with this name' }, ' (missing)'))),
        h('span', { class: 'muted' }, (e.app ? appLabel(e.app) : 'Default') + (e.count > 1 ? ` x${e.count}` : '')),
        h('span', { class: 'muted mono start', title: e.start || '' }, e.start || ''),
        h('div', { class: 'actions' },
          iconBtn('up', `Move ${e.shortcut} up`, '', () => move(i, -1), { disabled: i === 0 }),
          iconBtn('down', `Move ${e.shortcut} down`, '', () => move(i, 1), { disabled: i === entries.length - 1 }),
          iconBtn('edit', `Edit ${e.shortcut} in ${name}`, '', () => {
            S.editWs = editKey(i);
            delete S.wsDraft[editKey(i)];
            render();
            document.getElementById('ws-edit-first')?.focus();
          }),
          // The last entry going deletes the workspace, so that asks first.
          iconBtn('x', `Remove ${e.shortcut} from ${name}`, 'danger', () => (entries.length === 1 ? confirmWsDelete(name)
            : saveWs(name, entries.filter((_, j) => j !== i), `Removed ${e.shortcut}`, entries, true)))))),
    entryForm(name, {}, d => saveWs(name, [...entries, d], `Added ${d.shortcut} to ${name}`, entries)));
}

function wsView() {
  const out = [];
  const names = Object.keys(S.workspaces).filter(n => !S.q || n.toLowerCase().includes(S.q.trim().toLowerCase()));
  out.push(h('div', { class: 'toolbar' }, h('div', { class: 'grow' }),

  if (S.newWs) {
    const nameIn = h('input', { type: 'text', id: 'ws-name', placeholder: 'workspace name, e.g. dev', 'aria-label': 'Workspace name', spellcheck: 'false', value: S.newWsName,
      oninput: e => (S.newWsName = e.target.value) });
    out.push(h('div', { class: 'form', onkeydown: e => e.key === 'Escape' && (S.newWs = false, render()) },
      h('div', { class: 'row' }, nameIn, btn('Cancel', 'ghost', () => { S.newWs = false; render(); })),
      h('p', { class: 'lede', style: 'margin:0' }, 'Add the first entry to create it.'),
      entryForm('\0new', {}, async d => {
        const name = S.newWsName.trim();
        if (!name) { say('Give the workspace a name first', true); return false; }
        if (Object.hasOwn(S.workspaces, name)) { say(`"${name}" already exists. Add entries to it below.`, true); return false; }
        const ok = await saveWs(name, [d], `Created ${name}`, null);
        if (ok) { S.newWs = false; S.newWsName = ''; render(); }

      })));

  if (!Object.keys(S.workspaces).length && !S.newWs) {
    out.push(h('div', { class: 'list' }, h('div', { class: 'empty' },
      h('strong', null, 'No workspaces yet'),
      'A workspace opens several shortcuts at once, like a project in VS Code plus two terminals running claude.',
      h('div', null, btn('Create a workspace', 'primary', () => openPanel('newWs', 'ws-name'), 'plus')))));
  }
  if (!names.length && Object.keys(S.workspaces).length) {
    out.push(h('div', { class: 'list' }, h('div', { class: 'empty' },

  }
  for (const n of names) out.push(wsBlock(n, S.workspaces[n]));
  return out;
}

function settingsView() {
  const s = S.settings;
  // A settings row: name and one help line on the left, the control on the right.
  const setRow = (key, title, help, ...ctl) => h('div', { class: 'set-row' },
    h('div', null, h(key === 'defaultOpener' ? 'label' : 'span', { class: 'set-name', id: 'lbl-' + key, for: key === 'defaultOpener' ? 'set-opener' : null }, title),
      h('span', { class: 'set-help', id: 'help-' + key }, help)),
    h('div', { class: 'set-ctl' }, ctl));
  // One labelled radio group per setting; saves on change and keeps focus on the picked option.
  // `deco(k)` adds something before an option's label (the accent swatches), `extra` goes after the group.
  const seg = (key, title, help, msg, deco, extra) => setRow(key, title, help,
    h('div', { class: 'seg', role: 'radiogroup', 'aria-labelledby': 'lbl-' + key, 'aria-describedby': 'help-' + key },
      // Off Windows (wt null) there are no tabs or panes.
      (Array.isArray(SETTING_OPTS[key]) ? SETTING_OPTS[key] : Object.entries(SETTING_OPTS[key])).filter(([k]) => S.wt !== null || key !== 'terminalLayout' || k === 'here' || k === 'windows').map(([k, label]) => [
        h('input', { type: 'radio', name: key, id: `${key}-${k}`, checked: s[key] === k, onchange: () =>
          act(() => api('PUT', 'settings', { [key]: k }), msg(label))
            .then(() => document.getElementById(`${key}-${S.settings[key]}`)?.focus()) }),
        h('label', { for: `${key}-${k}` }, deco?.(k), label),
      ])), extra);
  const notes = [
    s.terminalLayout === 'here' && 'This window: upex in a terminal hands it over, a shell starts at the folder and exit comes back. Opened from here, terminals get their own window.',
    S.wt === false && ['tabs', 'panes'].includes(s.terminalLayout) && 'Windows Terminal (wt) was not found, so terminals open as separate windows.',
    S.wt === false && s.terminalShell === 'profile' && 'Without Windows Terminal, the default profile falls back to cmd.',
    S.wt && s.terminalShell === 'profile' && 'A start command (like claude) runs in cmd, since upex cannot know which shell your default profile uses.',
  ].filter(Boolean);
  // A section: heading with a Reset button (off while already at the defaults; none without `keys`), description, one panel.
  const sec = (id, title, desc, keys, ...rows) => h('section', { class: 'set-sec', id, 'aria-labelledby': id + '-h' },
    h('div', { class: 'set-head' },
      h('h2', { id: id + '-h' }, title),
      keys && btn('Reset', 'ghost', () => act(() => api('PUT', 'settings/reset', { keys }), `${title} back to defaults`),
        null, { disabled: keys.every(k => s[k] === S.defaults[k]), title: `Reset ${title} settings to their defaults` })),
    h('p', { class: 'set-desc' }, desc),
    h('div', { class: 'set-panel' }, rows));
  const hex = isHex(s.accent) ? s.accent : '';
  // Any color: saved when the picker closes, not on every drag.
  const customAccent = h('label', { class: 'custom-accent' + (hex ? ' on' : ''), title: 'Pick any accent color' },
    h('input', { type: 'color', id: 'accent-custom', value: hex || '#ff66aa', 'aria-label': 'Custom accent color',
      onchange: e => act(() => api('PUT', 'settings', { accent: e.target.value }), `Accent: ${e.target.value}`)
        .then(() => document.getElementById('accent-custom')?.focus()) }),
    hex || 'Custom');
  const pickOpener = e => act(() => api('PUT', 'settings', { defaultOpener: e.target.value }), `Folders open in ${appLabel(e.target.value)}`)
    .then(() => document.getElementById('set-opener')?.focus());
  const sections = [
    sec('set-gen', 'General', 'Shared with the upex selector in the terminal.', ['startView', 'views', 'searchIn', 'staleAfter'],
      seg('startView', 'Start view', 'The tab upex and this page open on.', l => `upex opens on ${l}`),
      seg('views', 'Tabs', 'Which tabs show, here and in the selector.', l => `Tabs: ${l}`),
      seg('searchIn', 'Search in', 'What plain search text matches. #tag, @opener and is: always work.', l => `Search: ${l.toLowerCase()}`),
      seg('staleAfter', 'Stale after', 'Not opened for this long counts as stale (is:stale).', l => `is:stale: not opened in ${l}`)),
    sec('set-list', 'List', 'How shortcut lists are ordered and what each row shows, here and in the selector.',
      ['sort', 'pinned', 'groups', 'paths', 'rowDetails', 'usage', 'goals'],
      seg('sort', 'Sort', 'Order of the list.', l => `Sorted: ${l}`),
      seg('pinned', 'Pinned', 'Pinned shortcuts on top, or under their own heading.', l => `Pinned: ${l}`),
      seg('groups', 'Groups', 'Headings per tag while not searching.', l => `Groups: ${l}`),
      seg('paths', 'Paths', 'How a row shows its folder path.', l => `Paths: ${l}`),
      seg('rowDetails', 'Row details', 'Tags and badges (pinned, app, missing) on a row.', l => `Row details: ${l}`),
      seg('usage', 'Usage', 'Last opened or open count at the right of a row.', l => `Usage: ${l}`),
      seg('goals', 'Goals', 'Open upgo goals of a folder with a goals.json, up to this many, on one line under its name.', l => `Goals: ${l}`)),
    sec('set-look', 'Look', 'Theme is this page only. Accent and density also apply to the selector.', ['theme', 'accent', 'density'],
      seg('theme', 'Theme', 'Light or dark for this page.', l => `Theme: ${l}`),
      seg('accent', 'Accent', 'Highlight color.', l => `Accent: ${l}`, k => h('span', { class: 'swatch ac-' + k, 'aria-hidden': 'true' }), customAccent),
      seg('density', 'Density', 'Row spacing.', l => `Density: ${l}`)),
    sec('set-open', 'Opening', 'What a folder shortcut opens in when it has no opener of its own.', ['defaultOpener'],
      setRow('defaultOpener', 'Default opener', 'Files still open in their default app.',
        h('select', { id: 'set-opener', 'aria-describedby': 'help-defaultOpener', onchange: pickOpener },
          S.apps.filter(a => a.key !== 'copy').map(a => h('option', { value: a.key, selected: s.defaultOpener === a.key }, a.label)),
          !S.apps.some(a => a.key === s.defaultOpener) && h('option', { value: s.defaultOpener, selected: true }, s.defaultOpener)))),
    sec('set-term', 'Terminals', S.wt === null ? 'Where terminal openers run.' : 'Where terminal openers run and which shell they start.',
      ['terminalLayout', 'paneSplit', 'terminalShell'],
      seg('terminalLayout', 'Layout', S.wt === null ? 'In the terminal upex runs in, or a new window.' : 'This terminal, new windows, or tabs or panes in Windows Terminal.',
        l => `Terminals open in ${l.toLowerCase()}`),
      S.wt !== null && s.terminalLayout === 'panes' && seg('paneSplit', 'Pane split', 'Direction of a new pane.', l => `Panes split: ${l.toLowerCase()}`),
      S.wt !== null && seg('terminalShell', 'Shell', 'What a new terminal starts.', l => `Terminals start ${l}`),
      notes.map(n => h('p', { class: 'set-note' }, n))),
    sec('set-apps', 'Custom openers', 'More apps to open folders in, like Cursor or Sublime. upex runs the command with the folder path after it. Same list as upex app in the terminal.', null,
      h('div', { class: 'list' }, S.openers.map(openerRow), openerAdd())),
    sec('set-backup', 'Backup', 'Move shortcuts to another PC: download a bundle here, import it there. Import merges, a shortcut with the same name is replaced. Like upex export and upex import.', null,
      setRow('export', 'Download bundle', 'Shortcuts, openers, workspaces and settings in one JSON file.', btn('Download', '', exportBundle, 'down')),
      setRow('import', 'Import bundle', 'A bundle from upex export or this page.',
        h('input', { type: 'file', id: 'import-file', accept: '.json,application/json', hidden: true, onchange: importFile }),
        btn('Import…', '', () => document.getElementById('import-file').click(), 'up'))),
    sec('set-insights', 'Insights', 'Read only: what you opened in the last 30 days (upex stats) and the checks of upex doctor.', null,
      h('div', { id: 'insights' }, insightsBody())),
  ];
  if (!S.insights) loadInsights();
  return [h('div', { class: 'set-main' }, sections)];
}

// ---------- Backup ----------

async function exportBundle() {
  try {
    const b = await api('GET', 'export');
    const url = URL.createObjectURL(new Blob([JSON.stringify(b, null, 2)], { type: 'application/json' }));
    const a = h('a', { href: url, download: `upex-bundle-${new Date().toISOString().slice(0, 10)}.json` });
    document.body.append(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    say(`Downloaded ${Object.keys(b.links).length} shortcuts`);
  } catch (e) { say(e.message, true); }
}

async function importFile(e) {
  const f = e.target.files[0];
  // Cleared, so picking the same file again still fires change.
  e.target.value = '';
  if (!f) return;
  let bundle;
  try { bundle = JSON.parse(await f.text()); } catch { return say(`${f.name} is not a JSON file.`, true); }
  await act(async () => {
    const r = await api('POST', 'import', { bundle });
    // Doctor checks run again on the coming re-render.
    S.insights = null;
    const n = (k, w) => `${r[k].length} ${w}`;
    // Undo only when links.json changed, else it would step back an older change.
    say(`Imported ${f.name}: ${n('added', 'added')}, ${n('updated', 'updated')}` + (r.clashes.length ? `. Names used twice: ${r.clashes.join('; ')}` : ''), r.clashes.length > 0, r.changed);
  });
  document.getElementById('import-file')?.nextElementSibling?.focus();
}

// ---------- Insights ----------

// Stats and doctor load on their own (doctor takes a moment) into #insights, so focus elsewhere in Settings stays.
function loadInsights() {
  const ins = S.insights = { stats: null, doctor: null };
  const fill = (k, v) => { ins[k] = v; if (S.insights === ins) showInsights(); };
  api('GET', 'stats').then(v => fill('stats', v), e => fill('stats', { error: e.message }));
  api('GET', 'doctor').then(v => fill('doctor', v), e => fill('doctor', { error: e.message }));
}

// Redraw #insights, keeping focus on Run again.
function showInsights() {
  const again = document.activeElement?.id === 'dr-again';
  // replaceChildren, unlike h(), would print a false or undefined part as text.
  document.getElementById('insights')?.replaceChildren(...insightsBody().filter(Boolean));
  if (again) document.getElementById('dr-again')?.focus();
}

function insightsBody() {
  const { stats: s, doctor: d } = S.insights || {};
  const opens = c => `${c} open${c === 1 ? '' : 's'}`;
  const max = s?.top?.[0]?.count || 1;
  const peak = Math.max(0, ...(s?.perWeek || []));
  const statsPart = !s ? h('p', null, 'Loading stats…') : s.error ? h('p', { class: 'err' }, s.error) : !s.total
    ? h('p', null, s.recorded ? 'No opens in the last 30 days.' : 'No opens recorded yet. Every open from now on counts.')
    : [
      s.top.map(t => h('div', { class: 'st-row' },
        h('span', { class: 'name', title: t.name }, t.name),
        h('span', { class: 'st-bar', style: `width:${Math.round((t.count / max) * 100)}%`, 'aria-hidden': 'true' }),
        h('span', { class: 'st-n', 'aria-label': opens(t.count) }, String(t.count)),
        h('span', { class: 'when' }, t.note))),
      s.more > 0 && h('p', null, `+ ${s.more} more, see upex stats`),
      s.openers.length > 0 && h('p', null, 'Opened with ', s.openers.slice(0, 5).map(o => `${o.name} ${o.count}`).join(' · ')),
    ];
  const weeks = s?.perWeek && peak > 0 && h('div', { class: 'ins' }, h('h3', null, `Opens per week, last ${s.perWeek.length} weeks (peak ${peak})`),
    h('div', { class: 'weeks', role: 'img', 'aria-label': s.perWeek.join(', ') + ' opens per week, oldest first' },
      s.perWeek.map(c => h('span', { class: c ? null : 'z', style: `height:${Math.max(6, Math.round((c / peak) * 100))}%`, title: opens(c) }))));
  const warns = Array.isArray(d) ? d.filter(r => r.status === 'warn' || r.status === 'fail').length : 0;
  const doctorPart = !d ? h('p', null, 'Running checks…') : d.error ? h('p', { class: 'err' }, d.error) : [
    d.map(r => h('div', { class: 'dr-row' },
      h('span', { class: 'dr-s ' + r.status }, r.status),
      h('span', { class: 'set-name' }, r.check),
      h('span', { class: 'detail' }, r.detail))),
    h('p', null, warns ? `${warns} to look at, everything else is fine.` : 'All good.'),
  ];
  return [
    h('div', { class: 'ins' }, h('h3', null, s?.total ? `Top shortcuts, ${opens(s.total)} in 30 days` : 'Top shortcuts'), statsPart),
    weeks,
    h('div', { class: 'ins' },
      h('div', { class: 'set-head' }, h('h3', null, 'Doctor'),
        // Stays while checks run, so keyboard focus is kept; a click then does nothing.
        btn('Run again', 'ghost', () => { if (d) { loadInsights(); showInsights(); } }, null, { id: 'dr-again', 'aria-disabled': d ? null : 'true' })),
      doctorPart),
  ];
}

// Custom openers (config.json apps): add, change the command, delete. No rename, shortcuts point at the name.
function openerRow(o) {
  const name = h('span', { class: 'name' }, o.name);
  if (S.editOp === o.name) {
    const cancel = () => { S.editOp = null; render(); };
    return h('form', { class: 'ws-add editing', onkeydown: e => e.key === 'Escape' && cancel(), onsubmit: async e => {
        e.preventDefault();
        if (await act(() => api('PUT', 'opener', { name: o.name, command: S.editOpCmd }), `Saved ${o.name}`)) { S.editOp = null; render(); }
      } },
      name,
      h('input', { type: 'text', id: 'op-edit', class: 'start mono', value: S.editOpCmd, spellcheck: 'false', autocomplete: 'off',
        'aria-label': `Command for ${o.name}`, oninput: e => (S.editOpCmd = e.target.value) }),
      h('button', { type: 'submit', class: 'btn primary' }, icon('check'), 'Save'),
      btn('Cancel', 'ghost', cancel));
  }
  if (S.confirmOp === o.name) {
    const key = o.name.toLowerCase();
    const n = S.links.filter(l => l.opener === key).length;
    const users = [n && `${n} shortcut${n > 1 ? 's' : ''}`, S.settings.defaultOpener === key && 'the default opener'].filter(Boolean);
    return h('div', { class: 'ws-entry op' }, name,
      h('div', { class: 'confirm' },
        h('span', null, `Delete ${o.name}?` + (users.length ? ` Used by ${users.join(' and ')}.` : '')),
        btn('Delete', 'danger solid', () => { S.confirmOp = null; act(() => api('DELETE', 'opener', { name: o.name }), `Deleted ${o.name}`,
          () => api('POST', 'opener', { name: o.name, command: o.command })); }),
        btn('Keep', 'ghost', () => { S.confirmOp = null; render(); })));
  }
  return h('div', { class: 'ws-entry op' }, name,
    h('span', { class: 'muted mono start', title: o.command }, o.command),
    h('div', { class: 'actions' },
      iconBtn('edit', `Edit ${o.name}`, '', () => {
        S.editOp = o.name; S.editOpCmd = o.command;
        render();
        document.getElementById('op-edit')?.focus();
      }),
      iconBtn('trash', `Delete ${o.name}`, 'danger', () => { S.confirmOp = o.name; render(); })));
}

function openerAdd() {
  const d = S.opDraft;
  const set = k => e => (d[k] = e.target.value);
  return h('form', { class: 'ws-add', onsubmit: async e => {
      e.preventDefault();
      const name = d.name.trim();
      if (await act(() => api('POST', 'opener', d), `Added ${name}. Pick it in any opener menu.`)) {
        S.opDraft = { name: '', command: '' };
        render();
        document.getElementById('op-name')?.focus();
      }
    } },
    h('input', { type: 'text', id: 'op-name', placeholder: 'name, e.g. cursor', value: d.name, spellcheck: 'false', autocomplete: 'off',
      'aria-label': 'Opener name', oninput: set('name') }),
    h('input', { type: 'text', class: 'start mono', value: d.command, spellcheck: 'false', autocomplete: 'off', 'aria-label': 'Command',
      placeholder: S.sep === '\\' ? 'command, e.g. cursor or C:\\Tools\\subl.exe' :'command, e.g. cursor or /usr/bin/subl', oninput: set('command') }),
    h('button', { type: 'submit', class: 'btn' }, icon('plus'), 'Add opener'));
}

// ---------- Shell ----------

// Appearance onto <html>. A hex accent goes on as inline vars, with black or white ink, whichever reads on it.
function applyLook() {
  const root = document.documentElement;
  for (const k of LOOK) if (S.settings[k]) root.dataset[k] = S.settings[k];
  const hex = isHex(root.dataset.accent) && root.dataset.accent;
  if (!hex) { root.style.removeProperty('--accent'); root.style.removeProperty('--accent-ink'); return; }
  const [r, g, b] = [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16));
  root.style.setProperty('--accent', hex);
  root.style.setProperty('--accent-ink', 0.299 * r + 0.587 * g + 0.114 * b > 150 ? '#111111' : '#ffffff');
}

// Per-tab state: an open add form or tag filter belongs to the tab it was opened on.
function resetTab() {
  S.adding = false; S.addErr = ''; S.tag = null; S.editing = null; S.confirming = null; S.archived = false;
  S.editWs = null; S.renamingWs = null; S.confirmWs = null; S.editOp = null; S.confirmOp = null;
  // Stats and doctor load again on the next visit to Settings.
  S.insights = null;
  if (TAB_KINDS[S.view]) S.addKind = TAB_KINDS[S.view][0];
}

function render() {
  applyLook();
  // A tab hidden by the views setting (changed from the terminal) falls back to Shortcuts.
  const hide = HIDES[S.settings.views] || [];
  if (hide.includes(S.view)) { S.view = 'links'; resetTab(); }
  document.getElementById('n-links').textContent = S.links.filter(l => l.tab === 'links' && !l.archived).length;
  document.getElementById('n-apps').textContent = S.links.filter(l => l.tab === 'apps' && !l.archived).length;
  document.getElementById('n-ws').textContent = Object.keys(S.workspaces).length;
  const u = S.update;
  document.getElementById('ver').replaceChildren(S.version ? 'v' + S.version : '', ...(u ? [
    h('span', { class: 'upd' }, `v${u.latest} is out`),
    h('button', { type: 'button', title: 'Copy, then run it in a terminal', onclick: () => copyText(u.cmd) }, u.cmd),
  ] : []));
  document.querySelectorAll('.tab').forEach((t) => {
    t.hidden = hide.includes(t.dataset.view);
    t.dataset.view === S.view ? t.setAttribute('aria-current', 'page') : t.removeAttribute('aria-current');
  });
  document.getElementById('q').placeholder = S.view === 'ws' ? 'Search workspaces' : S.settings.searchIn === 'names' ? 'Search names' : 'Search names, paths, tags';
  document.getElementById('q').title = S.view === 'ws' ? '' : '#tag, @opener, is:pinned, is:missing, is:stale, is:app, is:new, is:temp narrow the list';
  document.querySelector('.search').hidden = S.view === 'settings';

  document.getElementById('q-hint').textContent = TAB_KINDS[S.view] && !S.archived ? '#tag  @opener  is:pinned  is:missing\n↓ rows   Enter opens the top one' : '';

  // Keyboard focus in a row survives the re-render: the same control, else the row, else the row now at its place.
  const was = document.activeElement;
  const at = was?.closest?.('main .item[data-name]');
  const idx = at ? [...document.querySelectorAll('main .item[data-name]')].indexOf(at) : -1;
  const main = document.getElementById('main');
  main.removeAttribute('aria-busy');
  document.getElementById('title').textContent = TITLES[S.view];
  main.replaceChildren(...(S.view === 'ws' ? wsView() : S.view === 'settings' ? settingsView() : linksView()));
  // Settings sections as jump links under the Settings tab.
  const sub = document.getElementById('set-links');
  sub.hidden = S.view !== 'settings';
  sub.replaceChildren(...(sub.hidden ? [] : [...main.querySelectorAll('.set-sec')].map(el => h('a', { href: '#' + el.id }, el.querySelector('h2').textContent))));
  if (at && !document.activeElement?.closest('main')) focusIn(at.dataset.name, was.dataset.k) || rows()[Math.min(idx, rows().length - 1)]?.focus();
}
// Focusable rows; an open edit form is skipped, so arrows move past it.
const rows = () => [...document.querySelectorAll('main .item[data-name]:not(.editing)')];
// Focus a shortcut's row, or the control in it with data-k `k`. False when the row is gone.
function focusIn(name, k) {
  const r = rows().find(el => el.dataset.name === name);
  (r && k && r.querySelector(`[data-k="${k}"]:enabled`) || r)?.focus();
  return Boolean(r);
}

document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => {
  if (S.view === t.dataset.view) return;
  S.view = t.dataset.view;
  // Remembered for start view 'last'; Settings is not a place to start.
  const last = { links: 'shortcuts', apps: 'apps', ws: 'workspaces' }[S.view];
  if (last) api('PUT', 'last', { view: last }).catch(() => {});
  resetTab();
  render();
}));
// Coming back to the page re-checks paths and picks up CLI changes, unless something is being edited.
// Re-renders only on a real change: replacing the DOM mid-click would swallow the click that focused the window.
const busy = () => Boolean(S.adding || S.editing || S.newWs || S.editWs || S.renamingWs || S.confirming || S.confirmWs || S.editOp || S.confirmOp ||
  document.querySelector('main :is(input, select):focus'));
window.addEventListener('focus', () => { if (!busy()) load(busy); });
document.getElementById('q').addEventListener('input', e => { S.q = e.target.value; render(); });
// Search: Enter opens the top row, Down goes into the list, Up to its last row. Rows: Up/Down move,
// Up from the first goes back to search, Down from the last wraps to the first.
document.getElementById('q').addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); rows().find(r => r.open && !r.matches('.broken'))?.open(); }
  else if (['ArrowDown', 'ArrowUp'].includes(e.key) && rows().length) { e.preventDefault(); rows().at(e.key === 'ArrowDown' ? 0 : -1).focus(); }
});
document.getElementById('main').addEventListener('keydown', e => {
  if (!['ArrowDown', 'ArrowUp', 'Home', 'End'].includes(e.key) || !e.target.matches('.item[data-name]')) return;
  e.preventDefault();
  const all = rows();
  const i = all.indexOf(e.target);
  const to = { ArrowDown: i + 1, ArrowUp: i - 1, Home: 0, End: all.length - 1 }[e.key];
  if (to < 0) document.getElementById('q').focus();
  else all[to % all.length].focus();
});
document.addEventListener('keydown', e => {
  const typing = /^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement?.tagName);
  if (e.key === '/' && !typing && S.view !== 'settings') { e.preventDefault(); document.getElementById('q').focus(); }
  else if (e.key === 'n' && !typing && !e.ctrlKey && !e.metaKey && TAB_KINDS[S.view] && !S.archived) { e.preventDefault(); openPanel('adding', 'add-name'); }
  else if (e.key === 'Escape' && document.activeElement?.id === 'q') { e.target.value = S.q = ''; e.target.blur(); render(); }
});

applyLook();
load();
</script>
